name: Build

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-web:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for production
        run: pnpm build:web

      - name: Check bundle size
        run: |
          echo "📦 Bundle Size Report:"
          du -sh apps/web-client/dist/
          echo ""
          echo "📊 Asset Details:"
          ls -lh apps/web-client/dist/assets/ | tail -n +2

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-artifacts
          path: apps/web-client/dist/
          retention-days: 7

  build-backend:
    name: Backend Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend for production
        run: pnpm build:backend
