name: Code Quality

on:
  push:
    branches: [main, dev, feature/**]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Biome Lint & Format + Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          # Pinneado a la versión de devDependencies (@biomejs/biome 2.4.6)
          # para evitar deriva de reglas entre CI y local. Actualizar junto al bump de dependencia.
          version: 2.4.6

      - name: Run Biome CI (lint + format check)
        run: biome ci .

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check (web-client)
        run: pnpm --filter web-client exec tsc --noEmit

      - name: TypeScript type check (backend-service)
        run: pnpm --filter @misak/backend-service exec tsc --noEmit
