# apps/web-client/nginx.conf — Diccionario Misak (SPA + PWA + proxy /api y /auth)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Alineado al límite de 100 MB de @fastify/multipart para carga de medios (Spec 007)
    client_max_body_size 105m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Streaming multimedia con soporte HTTP 206 Partial Content sin buffering intermedio
    location /api/media/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API al backend por red interna Docker preservando el prefijo /api/
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy de autenticación preservando /auth/ y cookies HttpOnly de sesión
    location /auth/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA: service workers NUNCA en caché (vite-plugin-pwa autoUpdate)
    location = /sw.js {
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
    }
    location = /registerSW.js {
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
    }
    location = /manifest.webmanifest {
        add_header Cache-Control 'no-cache';
    }

    # Assets con hash de Vite: caché larga inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control 'public, immutable';
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
