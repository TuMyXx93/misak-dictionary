# apps/web-client/nginx.conf — SPA + PWA + proxy /api
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy al backend por red interna Docker (mismo origen en prod)
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA: service workers NUNCA en caché (vite-plugin-pwa autoUpdate)
    location = /sw.js {
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
    }
    location = /registerSW.js {
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
    }
    location = /manifest.webmanifest {
        add_header Cache-Control 'no-cache';
    }

    # Assets con hash de Vite: caché larga inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control 'public, immutable';
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
