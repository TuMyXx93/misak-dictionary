# Codecov Configuration
# https://docs.codecov.io/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
        if_ci_failed: error
    patch:
      default:
        target: 70%
        threshold: 5%

comment:
  layout: 'reach, diff, flags, files'
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

ignore:
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/test/**'
  - '**/tests/**'
  - '**/*.config.ts'
  - '**/*.config.js'
  - '**/vite.config.ts'
  - '**/vitest.config.ts'
  - '**/dist/**'
  - '**/coverage/**'
  - '**/node_modules/**'
