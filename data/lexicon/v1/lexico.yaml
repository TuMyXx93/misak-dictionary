        categoriaGramatical: s.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Kɵchik trulmeran, (naranja papaya, manadarina, limón), asha múnchi pɵnsraik srɵnɵmeran,
      pɵtsɵ, tsɵkel, palanta putsɵ.
    espanolGlosa: Anaranjado
    espanolExplicacion: este color se encuentra en la naturaleza a través de la diversidad de frutos tanto ácidos
      como dulces, entre ellos la papaya, la naranja, la mandarina, el limón, las uchuvas y la piña. Cada uno
      de estos frutos refleja la vitalidad y el equilibrio de la Madre Tierra, quien ofrece sus colores y
      sabores como expresión de abundancia y bienestar. En la cosmovisión cultural, estas tonalidades
      simbolizan la energía del sol y la dulzura de la vida, recordando la armonía que debe mantenerse entre
      el ser humano y los frutos que la naturaleza brinda generosamente.
  - codigo: C1.S1.M17.E004
    nodoCodigo: C1.S1.M17
