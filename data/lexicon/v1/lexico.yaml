    espanolExplicacion: término empleado de manera exclusiva para denominar la etapa del desarrollo del maíz en la
      cual los granos aún no han alcanzado su madurez fisiológica; se caracterizan por presentar una
      coloración blanca y un contenido líquido transparente de consistencia acuosa. En el lenguaje técnico,
      esta fase corresponde a la etapa R2.
