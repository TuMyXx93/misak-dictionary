    namtrikContexto: Kusrennikelan pestɵkusrep, tɵrik mallatɵ marɵpik, luliktɵ uñipik. Lɵtsɵ kutra pirap, tasik
      kinap. Chistɵ misak.
    espanolGlosa: Ser diligente
    espanolExplicacion: capacidad y disposición que tiene una persona para aprender nuevas habilidades y adquirir
      conocimientos con eficiencia y efectividad. Persona sana de espíritu y con armonía interior.
  - codigo: C1.S1.M3.E018
