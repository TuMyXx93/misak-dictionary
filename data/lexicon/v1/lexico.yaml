      kesrup katɵraik.
    espanolGlosa: Bejuco corralero (Davilla nitida Vahl Kubitzki). Su uso principal era en la construcción de
      casas de bahareque, debido a su dureza y resistencia, cualidades que le permitían reemplazar los clavos
      y asegurar estructuras duraderas. También cumplía una función medicinal y corporal, pues se amarraba
      alrededor de la cintura, especialmente a las niñas, con el propósito de conservar la firmeza del abdomen
      en la edad adulta. Esta planta ocupaba un lugar destacado dentro del conocimiento Misak, valorada por su
      utilidad en la arquitectura y la vida cotidiana. Además, se utilizaba para fabricar aros y sujetar
      guangos de leña, los cuales podían reutilizarse muchas veces gracias a la capacidad del bejuco para
      mantener su forma original. Otro uso tradicional importante era en la elaboración de tambores, donde
      servía para construir los aros que tensan los cueros, otorgando al instrumento el temple y la resonancia
      adecuados.
