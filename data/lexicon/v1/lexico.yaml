      pasrɵp, tsinakiamik trupɵnna pasrɵp, kaulli kayamelɵ trupɵnna pasrɵp, nashiku iliklɵ trupɵnna pasrɵp,
      pasrik wasrmera marɵp katɵraik pasríntsik. Pasríntiskmerape shush kɵp nɵtrik kɵp, pɵrtsi pasrik, wasr
      sincha pasrik,  lusik pasrikwane nu usrin kucha chipelɵ kɵn.
    espanolGlosa: Telar manual tradicional
    espanolExplicacion: utilizado para tejer prendas como anacos, chumbes, ruanas, cinchas, alfombras, morrales,
      bufandas y cobijas, entrelazando hilos de urdimbre y trama. Los hay de diferentes tamaños dependiendo
      del objeto a confeccionar.
