    namtrikContexto: Mananásrɵnkutre misakmera isua, pɵtɵmai pichip, kitrɵp marik kuari.
    espanolGlosa: Sombrero tradicional Misak, cuyo diseño simboliza el tiempo, el espacio, el movimiento en
      espiral del cosmos y el fluir del pensamiento Misak.
  - codigo: C1.S4.M1.E001
    nodoCodigo: C1.S4.M1
