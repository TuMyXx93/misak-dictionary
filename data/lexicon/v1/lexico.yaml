        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Srɵmpalasrɵ aship, yapsrɵ aship, pilli úmera kɵp, srepupen kaumera pillirap, pɵsr pinaipen
      pillirap lɵtsɵrap.
    espanolGlosa: Azul
    espanolExplicacion: el color azul, proveniente del aroíris y presente en el atuendo Misak tanto del hombre
      como de la mujer, representa la lejanía del firmamento y el aire puro que se respira en las montañas.
      Este tono refleja la serenidad del cielo y la quietud de los páramos, donde el viento, la neblina y el
      frío se convierten en parte del ritmo vital del territorio. En la cosmovisión Misak, el azul simboliza
      el equilibrio, la sabiduría y la contemplación, valores que orientan el pensamiento y la convivencia
      comunitaria. De esta manera, en la vestimenta tradicional, este color no solo adorna, sino que comunica
      la profunda conexión con el territorio, la identidad colectiva y el respeto por el espacio que da
      sentido y continuidad a la vida Misak.
  - codigo: C1.S1.M17.E005
    nodoCodigo: C1.S1.M17
    posicion: 5
    tipo: estandar
