    namtrikContexto: Trupak tsiwan ampɵmai imai pirishipik, tsikwan neerɵp kɵtrɵɵrɵp inchen.
    espanolGlosa: Cuerda de arrastre
    espanolExplicacion: elemento textil que se instala en la parte superior del telar y cumple la misma función
      que el bastón de arrastre, contribuyendo al mantenimiento de la tensión y la estabilidad de la urdimbre
      durante el proceso de tejido. Su incorporación responde principalmente a una medida de seguridad, ya que
      evita la pérdida del trabajo realizado en caso de que el bastón de arrastre sea retirado
      accidentalmente, por ejemplo, durante el juego de los niños. En estas circunstancias, la cuerda de
      arrastre conserva la estructura del tejido y permite continuar el proceso sin afectar significativamente
      el avance alcanzado.
  - codigo: C1.S3.M1.E023
    nodoCodigo: C1.S3.M1
