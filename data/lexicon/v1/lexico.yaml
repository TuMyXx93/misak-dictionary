    namtrikContexto: Úmerayu kenamisrɵpik,  ankuchu ú, pikɵtsutsik ú, pipinu ú, mapula ú. tsikul úmera.
    espanolGlosa: Fucsia o magenta
    espanolExplicacion: el color  fucsia o magenta está relacionado con las flores que brotan en los campos y
      jardines, resultado de la combinación entre el blanco y el rojo. En la cosmovisión cultural, este color
      representa la dulzura, la ternura y la armonía presentes en la naturaleza. Simboliza también el
      equilibrio entre la pureza del blanco y la fuerza vital del rojo, recordando que toda forma de vida nace
      de la unión y el complemento de los contrarios. Así, este color expresa la belleza, la sensibilidad y la
      conexión espiritual que une al ser humano con la Madre Tierra.
  - codigo: C1.S1.M17.E007
    nodoCodigo: C1.S1.M17
