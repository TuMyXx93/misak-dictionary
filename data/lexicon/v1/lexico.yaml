    espanolGlosa: Amarillo
    espanolExplicacion: el color amarillo representa la madurez y plenitud de los frutos, como el trigo, el maíz,
      la quinua y la cebada, símbolos de abundancia y sustento para la comunidad. En la cosmovisión cultural,
      este color refleja el ciclo de la vida que alcanza su punto de equilibrio, cuando la tierra ofrece sus
      mejores dones. Asimismo, el amarillo se manifiesta en las diversas tonalidades de los pájaros y las
      flores, expresando la alegría, la vitalidad y la energía del entorno natural, donde cada ser y elemento
      comparte la esencia luminosa del sol que da vida y fortaleza a todo lo existente.
