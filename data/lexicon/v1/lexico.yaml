    espanolExplicacion: proceso mediante el cual las plantas, tras un período prolongado de sequía o verano en el
      que se secan, se marchitan y adquieren una coloración café, recuperan su color verde, su vigor
      fisiológico y su vitalidad, manifestando un nuevo y renovado crecimiento.
