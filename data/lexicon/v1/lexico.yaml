    espanolGlosa: Técnica de tejido de la jigra
    espanolExplicacion: Método tradicional de confección de la jigra Misak que consiste en formar un lazo
      entorchado que actúa como elemento enlazador del tejido. Esta técnica se realiza exclusivamente a mano,
      sin el uso de agujas u otras herramientas, permitiendo la unión progresiva de las fibras hasta conformar
      la estructura de la pieza.
