        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Puintunmeran, wañiwan, pulɵ pirɵwan, pulɵ illimeran, pulɵ úmera asha múnchi pɵnsraiklɵ,
      kasherapyu pulɵ turi, pulɵ lusik kewa pɵntraik
    espanolGlosa: Blanco
    espanolExplicacion: el color blanco, presente en la simbología Misak, proviene de las nubes, las nieves, las
      flores, las aves, los animales y el maíz de tonalidad blanca. Este color encarna la pureza, la fidelidad
      y el cumplimiento de los actos que orientan la vida comunitaria. Asimismo, representa la paz y la
      alegría que acompañan la unión en el matrimonio, donde el atuendo nupcial resalta la armonía entre los
      seres y el equilibrio con la naturaleza. En la cosmovisión Misak, el blanco es signo de claridad
      espiritual y de respeto hacia los compromisos asumidos, reflejando la transparencia del corazón y la
      verdad que guía la existencia.
  - codigo: C1.S1.M17.E006
    nodoCodigo: C1.S1.M17
