        etiquetaOriginal: s., f., plac.
    namtrikContexto: Mámape usrinkɵp, srainkɵp, tatamerai srainkɵp, ishuk misakmera kasherawarmeran wamap kuik.
      Kan ishuk Misak pɵrɵtsik trana pasrɵppe numisakmisra pasrɵpen máma chipelɵ kɵn, munkɵpen kɵmɵ asha
      pasrɵpelɵ kuikpurɵ, tap waminchipik, tap pasrapik, tap uñipik, tap purukupik, tap isupik, mayaelan
      irapik kuikpurɵ.
    espanolGlosa: En la lengua namtrik, el sustantivo máma es una palabra polisémica que se escribe con tilde en
      la primera a, a diferencia del castellano, donde el acento recae en la última sílaba (mamá). Su
      significado varía según el contexto sociocultural. Se emplea para designar a la madre de una persona, a
      la esposa de un hombre Misak, a las mujeres que ejercen o han ejercido funciones dentro del Cabildo
      Misak y también es un titulo honorifico a aquellas mujeres que, por su trayectoria, experiencia,
      liderazgo y aporte a la comunidad, son reconocidas como referentes de autoridad y sabiduría.
