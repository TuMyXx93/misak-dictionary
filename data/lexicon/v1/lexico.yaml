    espanolGlosa: Venteo
    espanolExplicacion: el venteo  consiste en aprovechar la fuerza del viento (o de un ventilador) para separar
      el grano limpio de impurezas como el polvo, la paja, las hojas secas y los granos vanos (vacíos). Es el
      método tradicional y ecológico para limpiar la cosecha antes de consumirla, almacenarla o molerla.
