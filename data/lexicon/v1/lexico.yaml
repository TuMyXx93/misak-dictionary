        etiquetaOriginal: s.
    namtrikContexto: Nupirɵwan, yemwan,  musikmeran, ushameran, illimeran múnchi pɵnsraik.
    espanolGlosa: Negro
    espanolExplicacion: "el color negro, asociado al suelo productivo, representa a la Madre Tierra, fuente de
      vida y sabiduría. En ella tiene origen nuestra existencia: de su seno nacemos, en su superficie
      trabajamos y de sus frutos nos alimentamos mientras vivimos. Cuando llega el momento del descanso final,
      la Madre Tierra nos acoge nuevamente y nos abriga en su interior, cerrando el ciclo de la vida. En la
      cosmovisión Misak, el negro simboliza la fertilidad, la profundidad y el misterio del origen, recordando
      que la tierra no es solo materia, sino un ser vivo que nutre, protege y guarda la memoria ancestral de
      quienes la habitan."
