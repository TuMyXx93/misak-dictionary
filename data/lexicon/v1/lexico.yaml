        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Mentaiklɵ misak, kalɵ ashipelɵ kɵn cha, kekɵ unchai, wamaptɵken unchai kusrennik wam. Kekɵ
      marmup, sɵl marmup, kalɵ marɵp kɵpen misakasinap tsumɵntrai wam.
    espanolGlosa: Ser correcto
    espanolExplicacion: expresión utilizada en la educación del nakchak para instruir a las personas a ser
      correctas, con el fin de prevenir y evitar el juicio, la crítica o la culpa social por sus acciones
      negativas en el futuro.
  - codigo: C1.S1.M3.E013
    nodoCodigo: C1.S1.M3
    posicion: 13
    tipo: estandar
    formas:
      - orden: 1
        lema: Kɵrinatik kɵmik
        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: "Mu pupen, kúsrtɵ kutra, nena srɵtrɵp. Kɵrik pala nena yuulɵp wapik. \r

      Mukɵpen eshkamɵ pupen chi mamik nenik kaapen, kɵrinatɵ mámik nena srɵtrɵp."
    espanolGlosa: Ser presto
    espanolExplicacion: expresión utilizada cuando un visitante llega de manera inesperada y el anfitrión debe
      apresurarse a preparar comida para él.
  - codigo: C1.S1.M3.E014
    nodoCodigo: C1.S1.M3
    posicion: 14
    tipo: estandar
    formas:
      - orden: 1
        lema: Kɵtrɵtik kɵmik
        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Urekwan, kɵllikelan tsakmai kɵmɵtɵ tapmai mɵrɵp, chi wamintiklan tapmai utap kusrep, na
      waminchip kucha, tapmai waminchip.
    espanolGlosa: Ser humilde
  - codigo: C1.S1.M3.E015
    nodoCodigo: C1.S1.M3
