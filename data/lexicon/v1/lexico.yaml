      tap pirɵ misrɵp, ellmarikelɵ tap misrtrai.
    espanolGlosa: Abono orgánico
    espanolExplicacion: técnica agrícola que consiste en la aplicacion directa al suelo, durante el proceso de
      siembra, de materiales orgánicos tales como residuos de cocina, estiércol de animales domésticos —como
      el cuy y la gallina— y ceniza, con el propósito de mejorar la fertilidad del suelo y favorecer el
      desarrollo de los cultivos.
  - codigo: C2.S1.E021
    nodoCodigo: C2.S1
    posicion: 21
    tipo: estandar
    formas:
      - orden: 1
        lema: Pirɵ wekuanɵp
        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
