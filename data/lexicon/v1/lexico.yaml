        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Yukmɵsiku pɵlpasrɵppe tsalmɵkau ishikwan pɵn katɵ isua pusrik, trukutre lamɵ tsurɵ,
      trukutre  naksrukmai pɵn katɵ tsurɵ pɵñinkau pusrɵp, trukutrempe chak tsurɵ,  truwentaupe pip pɵñinkau
      wapurap, wallipurap, ipurap, ampɵpurap namui pirɵwan kuana eshkapik, chak patsɵpene lente katsik tsurɵ
      pusrɵp, pip kitrik puliktik marɵp srapepe antul tsurɵ namui maymeran eshkapik.
    espanolGlosa: Adornar
    espanolExplicacion: en el sombrero tradicional Misak, los adornos llamados pintas no son simples decoraciones,
      sino símbolos que transmiten la memoria y el pensamiento del pueblo. A través de figuras geométricas y
      representaciones de la naturaleza, los puntos cardinales y la fauna local, se teje la relación con el
      territorio y la espiritualidad. Las fibras de caña, teñidas en tonos verdes, fucsias y violetas, dan
      vida a estos diseños que reflejan identidad y cosmovisión.
  - codigo: C1.S3.M5.E010
    nodoCodigo: C1.S3.M5
    posicion: 10
    tipo: estandar
    formas:
      - orden: 1
        lema: Ú melsrɵp
        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Pikik, pillik, pulik, yalɵ isik tɵka tasikurekyu, kurɵ lataik kitra, wesrua licha, tulur para
      tampalkuariyu metrapmai tsi licha melsraik.
    espanolGlosa: Colocar los pompones de lana
    espanolExplicacion: los adornos de lana para el sombrero Misak se elaboran a mano. Se enrollan hebras de
      colores fucsia, azul, blanco y negro —alusivos a la bandera Misak— alrededor de tres o cuatro dedos.
      Luego, se ata el centro con otra hebra para asegurarlo, se retira de la mano, se cortan los extremos y
      se recortan los hilos hasta obtener un pompón esférico y uniforme. Finalmente, se elaboran dos pompones
      y se colocan en la parte frontal del sombrero.
  - codigo: C1.S3.M5.E011
