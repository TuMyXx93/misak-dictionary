        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Ya umpu kepatrup atrupen, nú misrɵp yellmera lawa, piluk, tramtrul, kal trul,  pipinu tɵka,
      mamik tɵkaik, asr tɵkaik, tasik tɵkaik kɵntrai isua itɵpetapelɵ.
    espanolGlosa: Semillas de prosperidad
    espanolExplicacion: al momento de ingresar a la casa, sobre la niña se esparcen semillas de Ochuva (Cestrum
      mutisii), tzimpalo (Solanum caripense), mora silvestre (Rubus adenotrichos) y curuba silvestre
      (Passiflora mixta). Este acto simbólico representa la transmisión de buenos augurios, deseándole suerte,
      salud, abundancia y prosperidad en su nueva etapa de vida.
