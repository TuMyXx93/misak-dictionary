      tumpaupala  kɵlɵntrai neera, mul-lana. Chap kɵlɵpen waara kalus kaya pilun trawa ichipelɵ shauwan tuin
      marɵp, yell trulchiktɵ misrtrai shauwan isik ɵrɵp.
    espanolGlosa: Semilla de trigo
    espanolExplicacion: >-
      antiguamente, se elaboraban guangos que se llevaban a la sala y se colocaban sobre el tumbado para que
      se secaran. Una vez secos, se bajaban y se extendían sobre un cuero de vaca, donde se desgranaban
      manualmente con la ayuda de un pilón de madera. Luego, las semillas se trasladaban a un lugar con
      viento, que facilitaba la separación de la semilla y los residuos vegetales.

      En la actualidad, este proceso ha sido reemplazado por el uso de la trilladora, una máquina que hace más
      eficiente la separación de la semilla de trigo.
