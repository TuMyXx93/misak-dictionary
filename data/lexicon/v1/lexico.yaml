    espanolGlosa: Reboso de color azul
    espanolExplicacion: utilizado por hombres y mujeres Misak en la vida cotidiana. Las mujeres lo llevan sobre la
      espalda, mientras que los hombres lo envuelven desde la cintura hasta las pantorrillas. Además, las
      mujeres lo emplean para cargar a los bebés en la espalda, asegurándolos con un chumbe, gesto que refleja
