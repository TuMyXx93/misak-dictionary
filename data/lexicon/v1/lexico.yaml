    tipo: estandar
    formas:
      - orden: 1
        lema: Pirɵ misrɵrap
        categoriaGramatical: sn.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sn.
    namtrikContexto: Waacha pirɵ misrik, ellmarik misrmik, kekɵ kuallmɵ kaumeran trerantrai warmɵ mentasrɵ petap
      kualla, putsɵrantrai warmɵtɵ.
    espanolGlosa: Degradación del suelo
    espanolExplicacion: debido a procesos como las prácticas agrícolas inadecuadas, la deficiencia de nutrientes,
      la erosión, la pérdida de materia orgánica y el desequilibrio nutricional disminuyen la capacidad
      productiva del suelo y reducen su fertilidad.
  - codigo: C2.S1.E020
    nodoCodigo: C2.S1
    posicion: 20
    tipo: estandar
    formas:
      - orden: 1
        lema: Pirɵ putsɵraik
        categoriaGramatical: sn.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sn.
