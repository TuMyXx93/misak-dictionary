        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: "Trurap mámikpe mur purawan kicha tsulak mainena trekaik, pulɵ tsulak nena mámik, tsutsik
      murik puaik kɵntrai. \r

      Unane, michipurawan pipa pumpui mara mannɵp, pumpui tusr yellwan lawa pusra mannɵpelɵ kɵn mentra papɵ
      imɵntrai."
    espanolGlosa: Durante su permanencia en la choza, la niña debe alimentarse con comidas bajas en sal y azúcar,
      entre ellas chancarina de maíz tostado mezclado con semillas de orquídea y sopa de maíz capio.
  - codigo: C1.S4.M1.E007
