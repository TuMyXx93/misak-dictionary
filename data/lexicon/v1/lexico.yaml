    namtrikContexto: Isap pasrɵmɵ yauelan, mentailan, wam kusrup, uñmɵ, tɵr waminchip, tɵr mɵrɵpik kɵmik Isaptik kɵmúmik.
    espanolGlosa: No ser mentiroso
  - codigo: C1.S1.M3.E012
