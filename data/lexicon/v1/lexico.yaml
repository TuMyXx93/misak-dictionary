    espanolGlosa: Enraizar a profundidad
    espanolExplicacion: desarrollo vigoroso de raíces,  a mayor profundidad en el sustrato para fomentar
      estabilidad, mayor absorción de nutrientes y agua, y resistencia a la sequía. Este termino tambien es
      usado para referirse a una persona "atornillada" a un cargo es alguien que se aferra obstinadamente a su
      puesto de trabajo o posición, negándose a abandonarlo.
