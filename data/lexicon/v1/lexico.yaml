    namtrikContexto: Tsitsɵ parɵntsik umpuwan pɵsr latrɵ aship. Lɵstɵ ya umpu kucha.
    espanolGlosa: Brecha de luz (o claro de luz)
    espanolExplicacion: apertura en el dosel forestal, generalmente originada por la caída natural de un árbol
      viejo o enfermo, que permite el paso directo de la radiación solar hasta el suelo de la selva. Este
      aumento súbito de luz activa el crecimiento acelerado de las plantas del sotobosque, convirtiéndose en
      un mecanismo clave para la regeneración y la biodiversidad de los ecosistemas tropicales.
  - codigo: C2.S1.E016
