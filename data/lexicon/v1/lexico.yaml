    espanolExplicacion: etapa del desarrollo del maíz en la que emergen los estigmas, comúnmente llamados “pelos”
      del maíz, cuya función es recibir el polen y permitir la fecundación; en el lenguaje técnico, esta fase
      se denomina etapa R1.
  - codigo: C2.S1.E019
