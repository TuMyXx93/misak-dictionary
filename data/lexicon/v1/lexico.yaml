      aship mara petsik, yanaa petsap amtruik. Mɵisrɵmpe tap tsurɵ pusrɵp marɵp, pek pek tusr ishikmeran mulla
      piship.
    espanolGlosa: Sombrero tradicional Misak
    espanolExplicacion: Desde tiempos antiguos, este fue el sombrero propio del pueblo Misak, elaborado con
      materiales naturales del entorno. Con la llegada de la industria, comenzaron a utilizar sombreros
      blancos de pasta y, más tarde, de fieltro negro. A partir de la década de 1980, inició un proceso de
      revitalización cultural que impulsó el retorno al sombrero tradicional, símbolo de identidad y
      pertenencia del pueblo Misak.
