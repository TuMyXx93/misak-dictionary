        etiquetaOriginal: s., plac.
    namtrikContexto: "Srɵsrɵ pulɵelɵ ketrua misha marɵp pasrik, tsik mallish tɵka marik.  \r

      Ya mɵrik tɵkartɵ, mamik wekala pɵnsrɵp, chikɵpen newarɵp, map putraik, pip srɵp tɵkaik,"
    espanolGlosa: Mesa
    espanolExplicacion: 'en la comunidad Misak, el concepto de mesa como mueble no era tradicionalmente parte de
      su cultura siendo introducido por los no indígenas con fines religiosos. La palabra Mishatsik se compone
      de una fusión de dos vocablos: Misha: adaptación fonética del término castellano "misa". Tsik: raíz del
      namtrik que significa "palo" o "madera". Literalmente, la palabra se traduce como "palo para la misa",
      lo que evidencia el origen y la función inicial de este objeto dentro del contexto religioso, antes de
      que se incorporara a otros usos cotidianos dentro de la comunidad.'
