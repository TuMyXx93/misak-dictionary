    namtrikContexto: Mul ishikwan kɵmɵwai, pish ishikwan kɵmɵwei,  tɵpɵtaku ishikwan parɵpelɵ kɵn, pɵl patsɵmuatɵ
    espanolGlosa: Cortar las hojas de caña brava
    espanolExplicacion: el corte se realiza en luna menguante, seleccionando las hojas de la parte media de la
      caña brava, pues tienen la consistencia ideal para elaborar sombreros.
  - codigo: C1.S3.M5.E005
