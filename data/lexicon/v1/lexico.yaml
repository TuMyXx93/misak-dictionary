    namtrikContexto: Mɵkelɵ nashik pachirantrap ilik pɵlpasrɵppe turiwan ilap, wentɵpe pulɵ pañuelɵ kui, pikɵ
      pañuelɵ kui,  nashiku ilap, kɵllikmisakpe  turwan lusrɵp,  tap puik mɵrape pekmisakmera pasriklan pena
      ilapelɵ misrik kɵn, mɵi kualɵmpe nam aship pasra ilapelɵ.
    espanolGlosa: Bufanda
    espanolExplicacion: en tiempos antiguos, los Misak empleaban una pequeña ruana enrollada alrededor del cuello
      como protección contra el frío, acorde con las condiciones climáticas de la cordillera y con los tejidos
      tradicionales elaborados en el territorio. Posteriormente, este elemento fue reemplazado por un paño
      rojo de forma cuadrada, que se ajustaba en la garganta y que llegó a conocerse en los círculos
      culturales de Popayán como “rabo de gallo” debido a su color intenso y llamativo. Con la llegada de
      comerciantes de origen ecuatoriano al territorio Misak, dicho paño fue sustituido por bufandas
      industriales rojas, que se consolidaron como las más utilizadas en la comunidad durante las últimas
      décadas. En la actualidad, muchos jóvenes Misak han revitalizado la práctica textil local elaborando sus
      propias bufandas, incorporando motivos del chumbe Misak o diseños inspirados en las cinchas de las
      jigras del pueblo Nasa, en un ejercicio de intercambio cultural y reafirmación identitaria.
