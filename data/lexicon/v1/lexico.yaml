    namtrikContexto: Ishik pusikwan pɵr marikmai lele marɵp, yam pucha pɵnsrɵp. Pɵlpasra kusrentrappe tsikantɵka
      ishik kepucha, yantɵ  kusreinkutrempe tsitrattrɵ pip ishik kepuchip tap kuari marɵpelɵ kɵn.
    espanolGlosa: Trenzar
    espanolExplicacion: el trenzado se elabora manualmente alternando finas tiras de caña brava. Se realiza con un
      número impar de cintas, cuya cantidad define la calidad, complejidad y finura del tejido. Existen
      variantes de 11, 15, 19 o 21 cintas, cada una asociada a un nivel de calidad específico.
  - codigo: C1.S3.M5.E007
    nodoCodigo: C1.S3.M5
