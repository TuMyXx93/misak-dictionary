    espanolGlosa: Violeta
    espanolExplicacion: el color violeta se encuentra presente en el aroíris y en algunas flores que adornan los
      paisajes naturales, simbolizando la unión entre la tierra y el cielo. En namtrik, este color también se
      asocia con los moretones que aparecen en el cuerpo a causa de los golpes, reflejando la manera en que el
      saber ancestral vincula los fenómenos naturales con las experiencias cotidianas del cuerpo. Así, el
      violeta representa tanto la fuerza vital que brota en la naturaleza como las huellas que la vida deja
      sobre el ser humano, integrando en un mismo símbolo la belleza, la memoria y el aprendizaje del dolor.
