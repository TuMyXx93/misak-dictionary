      putsɵramua waacha misrik.
    espanolGlosa: Tierra con baja materia orgánica
    espanolExplicacion: Suelo con pérdida de nutrientes y fertilidad causada por prácticas agrícolas inadecuadas,
      como la no reincorporación de residuos vegetales al terreno
