# Léxico del diccionario Misak — versión 1
# Fuente: diccionario-campo-namtrik-castellano.xlsm (equipo lingüístico).
# Modelo Sentido + Formas (Spec 005): cada sentido agrupa 1..N formas namtrik y su ubicación multinivel.
version: 1
fuente:
  documento: diccionario-campo-namtrik-castellano.xlsm
  revisor: Equipo lingüístico Misak
  duplicadosColapsados: 4
  nota: Corpus léxico v1 de los campos C1..C4 extraído deterministamente con modelo Sentido + Formas.
descripcionesNodos:
  - nodoCodigo: C1
    namtrikDescripcion: Yape ishuk misak lataik kɵn, pall tsinsraik, kap pusraik, kalu pɵnsraik, trik pasraik,
      tsutsikmera tsik tɵka marik, mayaelan maatanap irapik, yauelɵ sɵtɵmisra lincha kuraktɵ putrainuk.
      Nakchak, wallikatɵ, ya tarau, ya keta, michiya, pishiya pɵtɵkatan ke tɵkaik.
    espanolDescripcion: "Para el pueblo Misak, la casa no es solo una construcción material, sino un ser vivo que
      encarna la figura de la mujer. Ella resguarda y protege a quienes habitan en su interior, como una madre
      que abraza a su familia. Su forma es antropomorfa: tiene ojos, orejas, boca y esqueleto, y se cubre con
      capipaja, que funciona como su vestidura. Así, la casa no solo da cobijo, sino que también refleja la
      relación profunda entre el hogar, la naturaleza y la vida comunitaria."
  - nodoCodigo: C1.S1.M15
    espanolDescripcion: En el sistema de parentesco del namtrik, el prefijo kuchí significa literalmente “un poco”
      y se emplea para expresar relaciones familiares extendidas. Por ejemplo, un tío se denomina kuchímɵskai
      “un poco papá”. Este prefijo debe escribirse con tilde en la í para diferenciarlo de kuchi, término
      perteneciente al campo semántico de los animales domésticos que significa cerdo. En la lengua namtrik,
      los términos que designan a los bisabuelos y bisnietos incorporan el prefijo pisu, cuyo significado es
      “laguna”. Este elemento lingüístico evoca el origen ancestral del pueblo Misak como piurek (hijos del
      agua) y refleja la estrecha relación entre el sistema de parentesco, la memoria colectiva y la
      cosmovisión de la comunidad.
  - nodoCodigo: C1.S1.M17
    namtrikDescripcion: Namui pɵtɵkatan chi kɵpikpe pisiklɵ kɵn, tusrmera, puintunmera, úmera, pirɵmera, illimera,
      ushamera, pɵsr, pɵl, kɵnchapikmera, tru utu kɵshɵmpɵtɵ pasran néwan pisik.
    espanolDescripcion: El origen de los colores para el pueblo Misak se encuentra en la naturaleza, donde cada
      matiz refleja la conexión espiritual y simbólica con su entorno. Los tonos provienen de la flora, la
      fauna, los astros y del aroíris, que representa la armonía entre el cielo y la tierra. En la visión
      Misak, los colores no solo embellecen, sino que transmiten la energía de los elementos, la memoria
      ancestral y el equilibrio que sostiene la vida en comunidad.
  - nodoCodigo: C1.S1.M18
    espanolDescripcion: En la lengua namtrik, la denominación de las partes del cuerpo responde al nivel de
      conocimiento tradicional desarrollado por el pueblo Misak. El léxico anatómico se centra en los órganos
      y estructuras perceptibles a simple vista, tanto externas como internas, sin alcanzar el grado de
      especialización propio de la anatomía médica occidental. Por esta razón, tradicionalmente no existían
      denominaciones para estructuras microscópicas, como las células. No obstante, en el marco de los
      procesos contemporáneos de fortalecimiento y modernización de la lengua, se han incorporado neologismos
      para nombrar algunas estructuras microscópicas y conceptos científicos, entre ellos los espermatozoides
      y el óvulo. La nomenclatura anatómica se fundamenta, en muchos casos, en analogías con elementos de la
      naturaleza y de la vida cotidiana. Así, el riñón recibe el mismo nombre que el frijol, debido a su
      semejanza morfológica. De igual manera, la vesícula biliar comparte la denominación kɵntsɵ con la planta
      del tabaco y con las personas de temperamento fuerte, en alusión al sabor amargo característico de la
      bilis y del tabaco, así como a la asociación cultural de la amargura con el mal genio. Asimismo, algunos
      huesos reciben nombres basados en su parecido con objetos conocidos; por ejemplo, la clavícula se
      denomina literalmente «hueso del puente» (piuntsik tsutsik). Estos casos evidencian que las traducciones
      literales pueden resultar insuficientes y que la interpretación de los términos debe realizarse desde su
      contexto lingüístico y cultural.
  - nodoCodigo: C1.S1.M19.6
    espanolDescripcion: En esta sección se presenta cada sustantivo acompañado de un ejemplo de uso en un sintagma
      verbal, con el propósito de facilitar la comprensión de su significado y de su empleo en contexto.
      Asimismo, se señala el carácter polisémico de los términos kasrak, que en este campo semántico expresa
      un estado afectivo de alegría, y kɵntsɵ, que hace referencia al temperamento irritable o malhumorado de
      una persona.
  - nodoCodigo: C1.S1.M19.9
    espanolDescripcion: "En la lengua namtrik, el verbo «lavar» presenta cinco acepciones: pillmap, kinap, tsarɵp,
      kuallip y pirap, cuyo uso varía según el objeto o la parte del cuerpo que se lave. Aunque todos se
      traducen al castellano como lavar, cada uno posee un ámbito de aplicación específico. En este microcampo
      semántico, la selección del verbo depende de la parte del cuerpo a la que se refiera la acción."
  - nodoCodigo: C1.S2
    namtrikDescripcion: Kɵlintarau purashen wallikatɵ kɵn, nu yaumpu, alielɵ misak pupelan utap, mannɵp, pi
      srɵtrɵp, lus utrap palɵ ichip, urek kuapen, kasherapen, kɵsh punap, kuapen alikkip, yellemeran esekap,
      kuallip katɵrailan kucha esekainuik, utikmera wasr melsraiklɵ, kunchakmera, chikɵpen newarɵp
      esekamik lentɵnuk.
    espanolDescripcion: "El gran espacio familiar Misak que no es solo un lugar físico, sino un escenario de vida
      comunitaria. Sirve como bodega de herramientas, despensa donde se resguardan las semillas, dormitorio
      para visitantes, se celebran fiestas y se realizan velorios, también es el lugar de acogida para quienes
      participan en las mingas. Su versatilidad refleja la visión Misak de que la vida no está fragmentada: lo
      productivo, lo ritual y lo social conviven en un mismo lugar. Es símbolo de hospitalidad, solidaridad y
      continuidad del ciclo de la vida, que se fortalece en la memoria colectiva."
  - nodoCodigo: C1.S3
    namtrikDescripcion: Yaketape traukutre tɵrpa pua, kape trualɵmmera kui marɵp putrainuk, ishumpurpe pasrik
      pasrɵp, mɵkelɵpe tsik mitrɵp, kuari marɵp putrapelɵkɵn. Tsik mitrɵppe panku, kellu, patia, nintak mitrɵp
      putrapelɵ, palɵ wekutrɵp, lus patra utramɵrɵp, trekinchip lincha putrainuk.
    espanolDescripcion: "El corredor de la casa Misak constituye un espacio vital donde se expresan los saberes y
      oficios transmitidos de generación en generación. Tras la jornada agrícola o en los domingos, este lugar
      se convierte en escenario de creación y memoria colectiva: las mujeres tejen la ruana, el anaco, los
      chumbes y las jigras, mientras los hombres tallan la madera, construyen instrumentos musicales y
      elaboran el sombrero tradicional Misak. Más que un simple lugar de trabajo, el corredor refleja la
      organización social, la división de roles y la continuidad cultural del pueblo Misak."
  - nodoCodigo: C1.S3.M2
    namtrikDescripcion: Yu pɵrapɵnsrailɵpe, kampa ishuk misak marikelan eshkap pɵra pɵnsraiklɵ kɵn, mɵin kualɵmpe
      ishumpurmera, srɵik srɵik isua tsurɵ pusrɵp pɵrtsi marɵp pasrɵp kɵn, paweiyu srawa pusrɵp, kewa
      amɵnaiklɵyu tsusha pusrɵp kɵn.
    espanolDescripcion: Las figuras que se observan en los chumbes aquí presentados corresponden a los diseños
      elaborados por los antiguos Misak. En la actualidad, las mujeres Misak han fortalecido su creatividad,
      dando origen a nuevas y diversas representaciones que enriquecen este arte, siempre manteniendo la
      esencia y el sentido profundo de ser Misak.
  - nodoCodigo: C1.S1.M21
    namtrikDescripcion: Misak pirau, misak lincha wareiknukpe wamap amɵnamikwan nɵtrɵ eshkap kusrennɵpelɵ kɵn,
      mutsuk mutsuk purap yaikmik kɵn cha.
    espanolDescripcion: En la lengua namtrik, los saludos difieren significativamente de los utilizados en
      castellano, ya que su formulación responde a elementos propios de la cosmovisión Misak. Su uso depende
      de diversos factores, entre ellos las condiciones climáticas, el lugar de procedencia o destino de la
      persona y su estado térmico corporal, es decir, si experimenta sensación de frío o de calor. En
      consecuencia, los saludos no constituyen expresiones fijas, sino que pueden variar y construirse
      mediante diferentes combinaciones lingüísticas según el contexto comunicativo y las circunstancias de la
      interacción.
  - nodoCodigo: C2
    namtrikDescripcion: Ya pulu mɵn tul, chikɵpiktɵ petɵ nemɵra nakchaku sruaya nenamik ellmarinuk.
    espanolDescripcion: Este campo reúne los cultivos de pan coger del Yatul, fundamentales como ingredientes y
      materias primas para la preparación de los alimentos tradicionales. Aunque algunos de estos productos no
      se cultivan directamente en el Yatul, se incluyen aquí porque forman parte esencial de la dieta Misak y
      contribuyen al fortalecimiento de su soberanía alimentaria y autosostenimiento comunitario.
  - nodoCodigo: C2.S2
    namtrikDescripcion: "Tusrmera kasheran chipen, trektɵwai yellchik nikar kɵn. Ú srutrap, tru ú ishik
      pɵlsrukchiku, pɵsik lataik ú patsɵchiku trupachiktɵ yell putrapik kuin kɵn.\r

      Inchentɵ, yell neik kɵntraimpe, ú tɵpɵtak, ɵskɵ tuinchikwan, mishki marɵp puchikua kui, pɵñinkau kui, ú
      mutchap kape ú tuinchikwan niitrap atrua, kɵniship nepipen, ú chiku il lataik lus srɵlmai, ú patsɵchiku
      umpúsrɵnkatik, ɵskɵ tuinchik kepia, pɵsik lataikpa linchip kasherapen, tap yel misrɵpik kuin kɵn."
    espanolDescripcion: En la lengua namtrik, el proceso reproductivo de las plantas se denomina “matrimonio de la
      planta”, una expresión que hace referencia a la fecundación natural. Desde la concepción Misak, este
      proceso ocurre mediante la interacción de agentes naturales, como los insectos, el viento y la lluvia,
      que facilitan la polinización y hacen posible la reproducción de las plantas.
  - nodoCodigo: C2.S3
    namtrikDescripcion: Chikɵpiktɵ yapulu mɵn tulyu ellmarik, parɵkuaik pua nemɵra kɵtsɵyu pusra nenámik,
      itrɵmɵnmera, chiye kɵpiktɵ ellkuawa pɵnsraik, misak kuin katikpe manakucha pesannamúmik.
    espanolDescripcion: La huerta cercana constituye un espacio de producción de alimentos y de aprendizaje para
      los niños Misak, donde adquieren conocimientos y prácticas relacionadas con el cultivo de la tierra.
      Este proceso fortalece su vínculo con el territorio, fomenta el cuidado de la naturaleza y contribuye a
      la preservación de la soberanía alimentaria de la comunidad.
  - nodoCodigo: C3
    namtrikDescripcion: Ya pulu mamik lamɵtɵ ellmarmɵ, trausrɵmpe nɵtrɵ ellkuaik, yana an mara chikɵpen penɵmtrap.
    espanolDescripcion: Espacio de trabajo ubicado a una distancia lejana de la vivienda, destinado al cultivo
      intensivo de productos agrícolas con fines comerciales.
  - nodoCodigo: C4
    namtrikDescripcion: "Kau usha: kau umpu nɵmtɵ nɵtrɵrapelɵ, misak katɵraikmɵelɵ, namuipirau manakutre katrap warapelɵ."
    espanolDescripcion: "Los animales silvestres: en este campo se registran y describen las especies de fauna
      silvestre presentes en nuestro territorio, incluyendo aves, mamíferos, insectos, animales acuáticos,
      vermes y anfibios. Esta clasificación permite reconocer y documentar la diversidad de especies que hacen
      parte del territorio y de su entorno natural."
  - nodoCodigo: C4.S1
    namtrikDescripcion: "Illimera: wampik illimera, nɵtrik shush, kualtsarik, kimtsik, tepuisik tɵkar, pala kutra
      amɵñip, pirau lulɵp amɵñip, piu illimera kɵp, ya illimera atuall, yanushi, chumpi, piatuall kɵpik kuin
      kɵn."
    espanolDescripcion: "Las aves: en este subcampo se describen las especies de aves presentes en nuestro
      territorio, incluyendo tanto las aves residentes como las migratorias. Asimismo, se documentan aquellas
      especies que, en épocas anteriores, eran capturadas por los Misak para el consumo y la alimentación de
      las familias. Esta práctica tradicional de caza de aves ha desaparecido en la actualidad."
sentidos:
  - codigo: C1.S1.M1.E001
    nodoCodigo: C1.S1.M1
    posicion: 1
    tipo: estandar
    formas:
      - orden: 1
        lema: Misak
        categoriaGramatical: s.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Mananásrɵnkutre nam asiktɵ namun trenchipelɵ kuin kɵn, Wampia taik pirau, maya misak
      warapelan trukutre nam misak chipelɵ trupalatɵ lincha waraik kutre.
    espanolGlosa: Persona perteneciente al pueblo indígena Misak
    espanolExplicacion: "1. Persona perteneciente al pueblo indígena Misak: uno de los pueblos originarios de
      Colombia, asentado ancestralmente en el departamento del Cauca y con presencia en otras regiones del
      país. Su identidad se fundamenta en una historia, una lengua propia (namtrik), una cosmovisión, un
      sistema de conocimientos, prácticas culturales, formas de organización social y política, y una estrecha
      relación espiritual y territorial con su entorno. Como sujeto colectivo de derechos, el pueblo Misak
      preserva y fortalece su identidad étnica mediante la transmisión intergeneracional de sus saberes, el
      ejercicio de su autonomía y la defensa de su territorio, de conformidad con la Constitución Política de
      Colombia y los instrumentos nacionales e internacionales que reconocen los derechos de los pueblos
      indígenas. 2. Ser humano: individuo perteneciente a la especie Homo sapiens, dotado de conciencia,
      racionalidad, lenguaje, capacidad de acción y de interacción social. Como sujeto de derechos y deberes,
      forma parte de una comunidad y participa en la construcción de la cultura, la organización social y la
      transformación de su entorno. Esta definición abarca, según el contexto de uso, los conceptos de humano,
      persona, individuo, sujeto, hombre y, en sentido colectivo, gente."
  - codigo: C1.S1.M1.E002
    nodoCodigo: C1.S1.M1
    posicion: 2
    tipo: estandar
    formas:
      - orden: 1
        lema: Wampia
        categoriaGramatical: s.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Namui wamyupe wampia kɵn, pulɵelɵ ketrua nɵmui wamyu ɵyek pasrik. Wampia taikpe  purɵ lentɵ
      pirɵ  kɵpik kuin kɵn, trusrɵ trusrɵ misakmera nɵtrɵ warapelɵ tɵkaik. Wamyu kutre, piu kutre, piaiknuk
      kutre amtrupelɵ. Pulɵelɵ pupene chinchaintɵ kɵmɵtɵ, namuiwan aship pɵntrapelɵ, kasikmera tɵkar,  maya
      misakwan isua, tap tamara pera marɵp warapelɵ kɵpik kuin kua.
    espanolGlosa: Desde la perspectiva historica lingüística y etimologica el toponimo original del territorio
      Misak es  wampia, no "Guambía" en lengua namtrik se compone de las raices wam  "palabra" o legado de los
      mayores, pi "agua" configurando el significado de la voz de los hijos del agua expresion que sintetiza
      la profunda relacion del pueblo Misak con su memoria ancestral y su cosmovision, en contraste Guambía
      corresponde a una adaptacion fonetica impuesta durante la epoca colonial originada cuando los cronistas
      españoles reinterpretaron el termino propio.
  - codigo: C1.S1.M1.E003
    nodoCodigo: C1.S1.M1
    posicion: 3
    tipo: estandar
    formas:
      - orden: 1
        lema: Wam
        categoriaGramatical: s.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Mananásrɵnkutre namui nupirau, chi ushatɵkucha wamtɵkar kɵpik kua, nɵm asiktɵ wam mɵrɵsrɵp,
      wiirɵp, kiship, traship, mullip, wachip, srawap, isik itchip, pi wantrɵp, pirɵ kɵnap, asru kɵnik mɵrɵp
      misakmera kɵp, mayaelɵ mɵrtrai eshkap wam.
    espanolGlosa: Es el lenguaje simbólico, es la manera en que los elementos de la naturaleza y la vida comunican
      mensajes que no se leen con los ojos, sino con la memoria cultural, el oído y el corazón. Los sonidos de
      la lluvia, el viento, el agua, la tierra, el fuego, los sonidos que emiten los animales, el sonido del
      trueno y el sentir de nuestros sabedores, son textos vivos que transmiten saberes, advertencias y
      consejos, es decir comunicacion no verbal
  - codigo: C1.S1.M1.E004
    nodoCodigo: C1.S1.M1
    posicion: 4
    tipo: estandar
    formas:
      - orden: 1
        lema: Kampa wam
        categoriaGramatical: loc. nom.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: loc. nom.
    namtrikContexto: Pulɵelɵ ketrumuatɵ, namuimai kusrennɵpelɵ kɵp urasrɵ, kampa misakmera nakchaku kusrennɵp
      putrappe, chi ushameran kɵpen nepua ashipelɵkua, truuras srɵmpe ushamerape wamtɵkar kɵpen, truiklan
      mɵra, asha kusrennɵp, kɵrɵsrɵp, wachip, srɵitɵ srɵitɵ nemarɵp munchi pɵnsrɵp kuik wamwan, kampawam
      chipelɵ kɵn. Kampa misakmera pishau taiklɵ, srukyu pɵra warɵp, kuallip katɵraiklɵ srukwan mitra mariklɵ
      kucha, kampaiklɵ kɵn.
    espanolGlosa: Hace referencia a la voz de los antiguos Misak, conocidos en la tradición oral como Pishau,
      quienes, según la memoria histórica del pueblo Misak, habitaron este territorio antes de la llegada de
      los colonizadores y no recibieron el bautismo con sal conforme a la tradición cristiana. Ellos nos
      dejaron mensajes grabados en la piedra, esculpieron su memoria en la tierra y dieron nombre a todo lo
      que hoy reconocemos. Fueron quienes nos entregaron los consejos y advertencias necesarias para vivir en
      equilibrio, y con ello, la sabiduría propia que aún nos guía como pueblo.
  - codigo: C1.S1.M1.E005
    nodoCodigo: C1.S1.M1
    posicion: 5
    tipo: estandar
    formas:
      - orden: 1
        lema: Nam misak
        categoriaGramatical: loc. nom.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: loc. nom.
    namtrikContexto: Nam asiktɵ, kan wamtɵ tɵkar kɵp, na lateik wai Misak kui mɵra, kelatrɵtɵ shaumera mara kep,
      kelatrɵtɵ lincha isup, kuallip, namtrik waminchip warapelɵ.
    espanolGlosa: Nuestra gente
    espanolExplicacion: expresión empleada por el pueblo Misak para designar a las personas que pertenecen a su
      propia comunidad y comparten una identidad étnica, cultural, lingüística y territorial común. Más que
      una referencia a un grupo humano, esta denominación expresa un sentido de pertenencia colectiva,
      parentesco, reciprocidad y responsabilidad compartida, fundamentado en la cosmovisión Misak, la memoria
      ancestral, el uso de la lengua namtrik y el vínculo espiritual con el territorio. En este contexto, la
      expresión constituye un marcador de identidad colectiva que distingue a los integrantes del pueblo Misak
      como miembros de una misma comunidad histórica y cultural.
  - codigo: C1.S1.M1.E006
    nodoCodigo: C1.S1.M1
    posicion: 6
    tipo: estandar
    formas:
      - orden: 1
        lema: Namtrik
        categoriaGramatical: s.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Namtrik chippe namui wamwan, nam misak namtɵ mɵrɵp, namtɵ namui triktɵka wamintik nakchaku
      kusreik wam. Namui misak wamintik, namui triktɵka, nilɵwan kɵniship waminchip kuik.
    espanolGlosa: Es la lengua materna del pueblo Misak, un lenguaje articulado que constituye su forma de
      comunicación oral más desarrollada y distintiva. Se expresa mediante la producción de sonidos
      organizados en sílabas, palabras y oraciones, a través de los cuales se transmiten pensamientos, ideas y
      emociones que reflejan la visión propia y la identidad cultural del pueblo Misak.
  - codigo: C1.S1.M1.E007
    nodoCodigo: C1.S1.M1
    posicion: 7
    tipo: estandar
    formas:
      - orden: 1
        lema: Namui wam
        categoriaGramatical: loc. nom.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: loc. nom.
    namtrikContexto: Namui wampe, namui nupirau, nuisuik nuwam. Chikɵpiktɵ pɵtɵkatan kɵpikwan isua munchi pɵnsrɵp.
      Namui wampe namui triktɵka wamintiktɵ kɵmɵtɵ, chine namui nupirɵ wam tɵkartɵ kɵtre, namun kusrennɵp, chi
      tap kɵntrapikwan kalɵ kɵntrapikwan eshkapik, truiklan misakpe tɵr ashipelɵ kɵn, tusrmerai wam, illimerai
      wam, pimerai wam, srukmerai wam, wañimerai wam, ushamerai wam, srɵmpalasrɵ kɵnchapikmerai wam,
      ellmarielei wam, pɵlwai wam, pɵsrwai wam, lus utrik palɵ itsik wantrɵp wam, isikitsik sre traseik wam,
      kusrep misakmera, srɵl kɵnik mɵrɵp, yem kap aship, piaiklan eshkap, isup, mɵrɵp, ashipelɵ. Lutɵkutre
      namui pɵtɵkatan wam wan tɵr tɵkakua, ampɵkutre ikutre isua lincha wamintchip kusrep, kusrennik.
    espanolGlosa: "Es un concepto que integra la lengua en toda su amplitud, abarcando no solo su estructura
      lingüística, sino también su dimensión cultural más profunda: los sistemas de pensamiento, la memoria
      colectiva, las prácticas tradicionales, el vínculo con el territorio, las emociones y la espiritualidad
      que sostienen la vida del pueblo. Este concepto se entrelaza con la labor de los sabedores
      tradicionales, quienes leen en los astros, las nubes, los vientos, los sueños y en el propio cuerpo
      humano los mensajes necesarios para guiar a la comunidad en la siembra, el cuidado de la salud y la vida
      espiritual."
  - codigo: C1.S1.M2.E001
    nodoCodigo: C1.S1.M2
    posicion: 1
    tipo: estandar
    formas:
      - orden: 1
        lema: Watchip
        categoriaGramatical: v., educ.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: v., educ.
    namtrikContexto: Mántɵ misak misak ɵsik kɵllirap warámikwan, urekkutre lata lata tap lincha warɵntrai eshkap,
      kɵrɵsrɵp, kusrennɵp, kɵrikpala amɵñintrai watsik wam. Kasherap kualɵmpe, kualɵm mɵskalɵ isunanɵp,
      katɵyuk wachipelɵ kɵn, pa misrinuk pailɵyu atsi pɵntrɵmɵ lata lata purukuyap, tasik tranikyap, kantɵ
      isuntrai wentɵ kalɵ puik isuik warɵmɵntrai.
    espanolGlosa: Es una metodología pedagógica propia basada en la prevención, donde los errores no se ven como
      fallas, sino como oportunidades para aprender y fortalecer el desarrollo del ser. Se trata de una
      educación preventiva con justicia, que orienta a evitar la repetición de faltas y a cultivar la
      responsabilidad individual y colectiva. Estos principios se expresan en mecanismos de autorregulación y
      justicia intracomunitaria, cuyo propósito central es prevenir y mitigar los problemas, garantizando el
      orden, el equilibrio con la madre tierra y la continuidad del saber y el conocimiento ancestral.
  - codigo: C1.S1.M2.E002
    nodoCodigo: C1.S1.M2
    posicion: 2
    tipo: estandar
    formas:
      - orden: 1
        lema: Kɵrɵsrɵp
        categoriaGramatical: v.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: v.
    namtrikContexto: Pɵtɵkatan chi kɵpelan asha, kalɵ katɵrap nilik kɵmɵntrai, misakwan kalɵ marɵp amɵñimɵntrai,
      nɵmúntɵwai wentɵ kɵrik puramɵntrai, pishintɵ ɵsik lincha tap waramik kɵntrai, kusrennɵp wachip
      kɵrɵsraik. Urekmera tap mɵrtraimpe mɵrɵpchiktɵ, tap isua wamintamik kɵn, nurap ippe isua mɵrɵp intrai,
      srɵitɵ srɵitɵ kɵrɵsrɵp nemarɵp ampamik kɵn. Yantɵ mɵrmupene pishimarɵp, pinɵɵrɵp mɵ maram nepupik kɵn.
    espanolGlosa: "Es un tipo de relato que utiliza una historia sencilla y concreta usando metáforas para
      ilustrar una verdad más profunda como una lección o consejo moral, o de vida. Es una forma y un método
      de enseñanza articulado al ciclo de la vida, en diálogo con el espacio natural y con la integralidad de
      todo lo que lo compone: la casa, la moral, el comportamiento, el cuidado de la naturaleza, la
      sexualidad, la vida en pareja, el trabajo y la salud. En este proceso se transmiten los principios
      fundamentales del ser Misak, sustentados en los valores de complementariedad, reciprocidad y
      corresponsabilidad, que los niños deben aprender y practicar como guía para su vida comunitaria y
      personal."
  - codigo: C1.S1.M2.E003
    nodoCodigo: C1.S1.M2
    posicion: 3
    tipo: estandar
    formas:
      - orden: 1
        lema: Kusrennɵp
        categoriaGramatical: v.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: v.
    namtrikContexto: Urekwan nɵtrɵrap ampinkuintɵ nɵtrɵ kusrennɵp kɵmik, kuamnekatik, tapmai kusrentrai purukup,
      may marik. Kusrennik yamerayu kusrennɵpelɵ kucha, kɵrɵsrɵp wachip kusrennamik, “mantrɵwan wainuk waya
      amɵñintrai”.
    espanolGlosa: Educar
    espanolExplicacion: es un enfoque pedagógico que enseña a través de la práctica y el ejemplo, donde el
      aprendizaje surge de la experiencia y de la observación, especialmente de padres, maestros y mayores.
      Corresponde a las metodologías propias de enseñanza en los hogares Misak, mediante la transmisión oral y
      generacional de los principios fundamentales que orientan la vida comunitaria.
  - codigo: C1.S1.M2.E004
    nodoCodigo: C1.S1.M2
    posicion: 4
    tipo: estandar
    formas:
      - orden: 1
        lema: Pinɵɵrɵp
        categoriaGramatical: v., edu.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: v., edu.
    namtrikContexto: Pinɵɵrɵp chippe, ketriku shush urekchikwane, tarɵtsutik tɵka palachiktɵ itchip, incha tru
      tusr kapɵrwan kualana mutsɵsrɵpelɵ kɵn. Yantɵ kɵlik urek mɵrmupene, tsin tɵka ásrɵrɵ patrɵp, pirɵp
      inchipelɵkɵn, misak utu marene kɵrik misra katɵpe kalɵ marmelɵ kɵntrai. Inchen yantɵ kɵlirawa mɵrmup
      kalɵ marɵp pasrɵpene, kalustsi manniktɵwein kɵn chipelɵkɵn, truik tru namui pinɵɵrɵp taik wam kɵtre.
    espanolGlosa: Es un método propio de corrección de las faltas, donde las formas de reprender varían según la
      edad y la falta cometida. Cuando un niño pequeño incurre en desobediencia, se le corrige con ramas de
      verbena (Verbena officinalis) y, luego, con una infusión preparada de sus cogollos, que se le da a beber
      para que reconozca su error y aprenda a no repetirlo. En la adolescencia, la corrección se realiza con
      ortiga (Urtica dioica) y agua fría, bañando su cuerpo como recordatorio de la falta cometida. En el caso
      de los adultos, las faltas se ponen en conocimiento del cabildo, autoridad encargada de decidir la
      sanción correspondiente, que puede incluir la flagelación con correa como acto de justicia y de
      equilibrio comunitario.
  - codigo: C1.S1.M2.E005
    nodoCodigo: C1.S1.M2
    posicion: 5
    tipo: estandar
    formas:
      - orden: 1
        lema: Tsiau
        categoriaGramatical: s.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Pulɵelɵ pirɵ nilap kepatrup urassrɵ, misak mur pɵntrapelan kullaarantrap truyu wannɵp,
      mesrɵp, kɵtrɵichip katɵraik.
    espanolGlosa: El cepo
    espanolExplicacion: constituye un instrumento de castigo conformado por dos maderos pesados que, al unirse,
      forman orificios destinados a inmovilizar las extremidades del infractor. Durante la época colonial,
      este instrumento fue empleado por los colonizadores españoles como mecanismo de dominio y control social
      sobre las comunidades indígenas de América, entre ellas el pueblo misak, con el propósito de imponer
      sanciones y reforzar su autoridad sobre la población sometida. Aunque este instrumento llegó a
      integrarse posteriormente en algunas prácticas punitivas de comunidades originarias, su origen responde
      a la lógica de sujeción propia del régimen colonial. En la actualidad, esta forma de castigo se
      encuentra abolida en la comunidad Misak por razones de derechos humanos.
  - codigo: C1.S1.M3.E001
    nodoCodigo: C1.S1.M3
    posicion: 1
    tipo: estandar
    formas:
      - orden: 1
        lema: Mallatik kɵmik
        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Uninuk trai trai punap pasramɵtɵ mallatɵ kusra punapik, malla martrap isupik, chiwuantɵkucha
      mallatɵ marɵpik. Chi martrap pɵlpasrɵppe patsamne martrap isupik, lutɵ kuchimɵ.
    espanolGlosa: Ser diligente
    espanolExplicacion: persona ágil, eficiente, diligente y que realiza sus tareas con facilidad y rapidez.
  - codigo: C1.S1.M3.E002
    nodoCodigo: C1.S1.M3
    posicion: 2
    tipo: estandar
    formas:
      - orden: 1
        lema: Matratik kɵmik
        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: "Urekwane asr kullakpatɵ, tasik murtramuatɵ kusrennɵp kɵmik, utɵpe chi maram kusremuatɵ purɵ
      petɵ puraipik kɵn.\r

      Chikɵpen pétɵ nepupik kɵn cha, chi marɵp pɵlpasrɵppe, pestɵ némarɵp, tapik marɵp, kɵmik kusrennɵp. \r

      Ikpe srulɵwan kemesra kusrennik wam."
    espanolGlosa: Ser precavido
    espanolExplicacion: representa el acto de prepararse antes de que surja la necesidad. La frase "Enséñale a los
      niños y jóvenes los quehaceres de la vida antes de que sus manos envejezcan" no se refiere literalmente
      a que sus manos se hagan viejas, sino a que es importante que los niños y jóvenes aprendan desde
      temprano las habilidades, responsabilidades y sabiduría necesarias para enfrentar la vida, porque el
      tiempo pasa rápido y, si no se preparan a tiempo, podrían llegar a la adultez sin estar listos para
      valerse por sí mismos. El mensaje es una advertencia sobre no postergar la formación, la enseñanza y el
      crecimiento personal, porque la juventud es corta y el tiempo no espera. Para esta enseñanza se usa la
      historia Misak de la armadilla que se va a casar.
  - codigo: C1.S1.M3.E003
    nodoCodigo: C1.S1.M3
    posicion: 3
    tipo: estandar
    formas:
      - orden: 1
        lema: Merɵkɵmik kɵmik
        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Chi kualla tɵkakuilan, misrielan, merɵkɵmɵ srɵtra mapik kɵmik.
    espanolGlosa: Ser bondadoso
  - codigo: C1.S1.M3.E004
    nodoCodigo: C1.S1.M3
    posicion: 4
    tipo: estandar
    formas:
      - orden: 1
        lema: Metɵpik kɵmik
        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Yantɵ munkucha ulɵkɵmurcha, ankui, chikɵpen peptra taiklan ulɵmisrakua, chap tranɵp, chap
      unkuacha tranɵp, truwam kɵn.
    espanolGlosa: Ser honrado
    espanolExplicacion: expresión que hace referencia a la condición de una persona que ha cumplido íntegramente
      con sus obligaciones, ya sea mediante el pago total de una deuda o la devolución de los bienes que le
      fueron prestados. En este sentido, denota rectitud, responsabilidad y cumplimiento de los compromisos
      adquiridos.
  - codigo: C1.S1.M3.E005
    nodoCodigo: C1.S1.M3
    posicion: 5
    tipo: estandar
    formas:
      - orden: 1
        lema: Misak ashiptik kɵmúmik
        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Mentaiklan, kalɵ aship, kalɵ waminchip kɵmúmik.
    espanolGlosa: No ser criticón
  - codigo: C1.S1.M3.E006
    nodoCodigo: C1.S1.M3
    posicion: 6
    tipo: estandar
    formas:
      - orden: 1
        lema: Misak Misak kɵmik
        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Kɵllikelɵ wamintikwan mɵra, kɵrik pala pasrapik, mu chi taikmik, mupakucha pishintɵ tsupik.
    espanolGlosa: Ser digno
    espanolExplicacion: se comprende como la fuerza interior que mantiene en equilibrio el cuerpo, la palabra y el
      pensamiento. Es el valor que una persona conserva al reconocerse parte del territorio, de su familia, de
      la memoria y la palabra de sus mayores.
  - codigo: C1.S1.M3.E007
    nodoCodigo: C1.S1.M3
