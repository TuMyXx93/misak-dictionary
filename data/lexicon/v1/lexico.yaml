    espanolGlosa: Café
    espanolExplicacion: este color, que en castellano se asocia con el tono del café tostado, adquiere en la
      lengua Misak un significado distinto y profundamente ligado a la naturaleza. Para el pueblo Misak, el
      color café se identifica a partir del color de la lana de oveja, elemento que proviene directamente del
      entorno y de la vida cotidiana comunitaria. Esta relación expresa una conexión simbólica con los
      recursos naturales y con el trabajo manual, donde los colores no solo describen tonalidades, sino
      también historias, oficios y vínculos con los seres que habitan la Madre Tierra.
