    espanolGlosa: Resembrar
    espanolExplicacion: práctica agrícola que consiste en reemplazar una planta que ha muerto o no logró
      establecerse, ya sea por procesos de pudrición, daños ocasionados por insectos u otros factores que
      afectan su desarrollo.
  - codigo: C2.S1.E017
    nodoCodigo: C2.S1
    posicion: 17
    tipo: estandar
    formas:
      - orden: 1
        lema: Kuallip
        categoriaGramatical: v.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: v.
    namtrikContexto: Pirɵwan kuallip, kachull muta awenchi muta, tramkuallip, atsin kuallip, kaui kitap, ellkuap,
      lallip, trarɵ pusrɵp, tsin tanap, tsin katrɵp, tusr uchip, wekuanɵp, pimay trap, pirɵ wekuchip, may
      lallip.
    espanolGlosa: Trabajar la tierra
    espanolExplicacion: término que se utiliza de manera específica para referirse a las labores agrícolas
      realizadas directamente sobre el suelo, tales como la siembra, el aporque, el deshierbe, la roza y la
      cosecha, ejecutadas mediante herramientas propias de estas actividades. En la actualidad, este término
      suele emplearse de forma imprecisa para designar ocupaciones que no guardan relación con el trabajo
      agrícola. En este sentido, no es adecuado utilizar el término kuallip para actividades como la docencia,
      el comercio, el ejercicio de cargos en el cabildo u otros oficios ajenos al trabajo directo de la
      tierra.
  - codigo: C2.S1.E018
    nodoCodigo: C2.S1
