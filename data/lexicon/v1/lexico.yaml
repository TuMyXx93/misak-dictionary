    namtrikContexto: Metrappe turi pasrielan pulɵp lusap itɵpɵrɵnawa amɵnaiklɵ, wentɵpe payetapallmera pena lusap,
      mɵisrɵmpe pañupallwan pena lusapelɵ.
    espanolGlosa: La bayeta
    espanolExplicacion: es un tejido de lana de textura suave y poco ajustada, con una superficie afelpada en uno
      de sus lados. Se elaboraba en diversos colores —blanco, rojo, amarillo, castaño, negro, entre otros— y
      fue ampliamente utilizada desde el siglo XVIII. Entre los Misak, las mujeres la usaban sobre la espalda
      y los hombres la envolvían desde la cintura hasta las pantorrillas. Su uso era muy apreciado por su
      capacidad para brindar abrigo y protección frente al frío del territorio altoandino.
