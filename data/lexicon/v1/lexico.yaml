    namtrikContexto: Namui wamyu kuarimpe illimerai kuariwan asha isua petsamik marik kuarin kɵn. Wentɵsrɵ pulɵelɵ
      ketrua yalɵ kuari sruamtrua, truikwan kuarin kɵn chipen pena petsapelɵ misrik kɵn.
    espanolGlosa: Cresta
    espanolExplicacion: 'kuari significa literalmente "cresta", pero para la memoria y tradición Misak, no es solo
      una palabra: es el sombrero natural que la naturaleza tejió para las aves. Un adorno vivo que nunca se
      desprende, corona que distingue y acompaña, signo de orgullo y fuerza que anuncia el amanecer y el
      latido de la vida.'
  - codigo: C1.S3.M5.E003
    nodoCodigo: C1.S3.M5
    posicion: 3
    tipo: estandar
