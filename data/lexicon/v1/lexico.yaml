    espanolGlosa: Partir las hojas
    espanolExplicacion: rajar la hoja de caña brava en tiras delgadas y uniformes para el trenzado, utilizando las
      uñas o insertándola en el ojo de una aguja.
  - codigo: C1.S3.M5.E002
