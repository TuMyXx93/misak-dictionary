    espanolGlosa: Acción de contar las hebras de la urdimbre con una aguja para el acabado del tejido.
  - codigo: C1.S3.M1.E024
    nodoCodigo: C1.S3.M1
    posicion: 24
    tipo: estandar
    formas:
