      lliraikmɵsrɵ,  pishimisakwan keta pɵnsrɵpelɵ, yantɵ unɵ patsap, eshekamik patsap, yantɵ kɵlik sun pɵik
      kɵmik kɵliramikwan isua.
    espanolGlosa: Despojarse de la pereza
    espanolExplicacion: las jigras y los husos elaborados por la niña durante su reclusión en la choza deben ser
      llevados y dejados en un lugar donde nadie haya pisado antes. Este gesto simbólico marca el abandono del
      juego infantil y de la pereza, indicando que a partir de ese momento asume las responsabilidades propias
      de la vida adulta.
  - codigo: C1.S4.M1.E011
