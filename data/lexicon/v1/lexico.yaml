      trulmeran kucha, pipinu, kaltrul, pɵtsɵ, kamɵ, pantsɵ, piñi, mitsɵ, lutrik kɵn.\r

      Uchip 3,: Pirɵ umpu pɵntrapik, luwan, itrɵmɵnwan, tusrmeran uchip chipelɵ kɵn.\r

