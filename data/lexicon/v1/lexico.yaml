    namtrikContexto: Isuinuk, wamintinuk, kualinuk, chi tɵkakuinuk, mukucha lata kɵmik kɵpen, kalɵ aship, namik
      kuik mɵrik, tsalɵ aship kɵmúmik.
    espanolGlosa: No ser envidioso
  - codigo: C1.S1.M3.E020
