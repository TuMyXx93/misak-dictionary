        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Utɵ trupiship, tasikwan pusra wamɵ chi marɵpik kɵmik.
    espanolGlosa: No perder el tiempo
    espanolExplicacion: evitar el hábito de retrasar o posponer tareas, decisiones y responsabilidades
      importantes, sustituyéndolas de manera consciente y voluntaria por actividades de menor relevancia o que
      resultan más fáciles, placenteras o inmediatas.
