        lema: Munásrɵ?
        categoriaGramatical: interj.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: interj.
    namtrikContexto: Nepua isua asikmɵ yapsrɵ kutre atrupen wamik wam.
    espanolGlosa: ¿Desde qué infinito vienes? expresión de saludo utilizada tradicionalmente por el pueblo Misak
      para dar la bienvenida a quienes llegaban desde lugares lejanos. Su significado se fundamenta en una
      concepción ancestral del territorio, propia de épocas en las que la extensión del mundo conocido no
      tenía límites claramente definidos ni plenamente observables. En este contexto, la referencia al
      “infinito” evocaba la inmensidad del espacio y la procedencia distante de las personas, reflejando una
      visión cultural y simbólica del territorio dentro de la cosmovisión Misak.
    dialogo:
      respuestaNamtrik: Yúsrɵ
      respuestaNamtrikContexto: Lɵtik wam.
      respuestaEspanolGlosa: Llegué, aquí estoy
      respuestaEspanolExplicacion: expresión de respuesta utilizada como réplica al saludo de bienvenida, mediante
        la cual la persona que arriba manifiesta su presencia en el territorio. Su uso implica el
        reconocimiento de un retorno después de un periodo prolongado de ausencia y de haber recorrido
        diversos espacios, reafirmando el vínculo con el lugar de origen y la pertenencia al territorio dentro
        de un marco cultural y comunitario.
