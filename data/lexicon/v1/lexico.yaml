        etiquetaOriginal: s.V.2
    namtrikContexto: Ishuk unan srɵ papɵ impípapɵ misren, yauelɵpe untakmai intsap marɵp, wammɵrɵsrɵp putrapelɵ
      kɵpik kuin kɵn.                                                      Ú srutran chip, unɵ patsan
      chip,                          pɵ wésrutran chip, yantɵ kɵliran chip,  kap ka unɵ pun chip. Ɵya chip pip
      kualɵm míchiyau esekawa wannɵpelɵ, pɵsr pachimɵ, srekuamɵ pishiramɵ  wantrai.
    espanolGlosa: Primera menstruación
  - codigo: C1.S4.M1.E008
    nodoCodigo: C1.S4.M1
