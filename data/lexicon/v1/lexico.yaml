    namtrikContexto: Ampiktik kɵmɵ, pura trulmera kapsrɵ katik netsɵ tɵkaik.
    espanolGlosa: Mazorca de maíz seca y bien formada, completamente llena de granos, sin que le falte ninguno a
      lo largo de toda la tusa.
  - codigo: C1.S4.M1.E002
    nodoCodigo: C1.S4.M1
    posicion: 2
    tipo: estandar
    formas:
      - orden: 1
