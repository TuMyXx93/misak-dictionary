    namtrikContexto: Miskan kɵshɵmpɵtɵ pusruk kal pusran chipen, srɵpyu pisrɵmisrɵp, parap, yalɵrap, pikuchip,
      pusrkuap, pachip pisrɵ misrɵpik kɵn. Trek misrɵppe mana lliraikmɵnuk llirapen, pi kapsrɵ,
      chillikmerasrɵ, nu kau umpusrɵ. Kal wan wesruntrappe kusrepelɵ, mentu kauwan, nɵtrɵ kɵntsɵpa mara kutra,
      pachikpi usra, pia ishik pula, lɵtsɵ kantsi utɵ misren lusrɵpelɵkɵn, pɵlɵm mera kia kasri utɵ misren
      wesrupelɵ kɵn.
    espanolGlosa: Crin del aroiris. En la sabiduría Misak se reconoce que ciertos tipos de granos en la piel
      aparecen por la influencia del aroíris. Esto sucede cuando una persona transita por ciénagas, quebradas,
      ríos o lagunas sin mostrar el respeto necesario hacia esos espacios y sin realizar los rituales
      correspondientes. En tales casos, algunas partes del cuerpo se cubren de granos que producen una picazón
      persistente, la cual no encuentra alivio en la medicina occidental. Según el conocimiento ancestral,
      esta afección se origina porque el aroíris introduce en la persona unos gusanos diminutos (pelos), cuyos
      colores son semejantes a los del propio aroíris. Para sanar, no se recurre a fármacos modernos, sino a
      plantas medicinales tradicionales, pues son ellas las que extraen de la piel estos gusanos, que se
      asemejan a cabellos finos y multicolores.
