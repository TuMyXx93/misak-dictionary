    espanolGlosa: Picar la tierra
    espanolExplicacion: práctica agrícola que consiste en  descompactactar la tierra con el fin de prepararlo para la siembra.
  - codigo: C2.S1.E022
    nodoCodigo: C2.S1
    posicion: 22
    tipo: estandar
    formas:
      - orden: 1
        lema: Pupila
        categoriaGramatical: s.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Ya wampiku, tulmerayu pu wanikmik, itɵpunap, ushamera chap maik, pu chikaik usha itɵlulɵp
      kɵsak marik pupila.
    espanolGlosa: Césped compactado
    espanolExplicacion: condición del pasto originada por el exceso de pisoteo humano, el tránsito frecuente de
      animales o el sobrepastoreo, que provoca la compactación del suelo. Esta compactación reduce la
      porosidad del sustrato e impide la adecuada infiltración de aire, agua y nutrientes hacia las raíces,
      afectando el crecimiento del pasto y acelerando su degradación.
