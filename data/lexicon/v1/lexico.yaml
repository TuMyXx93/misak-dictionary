    namtrikContexto: Lɵtsɵ mara nakchaku kui, wallikatɵ kui, tap kɵlɵntrainpa, su kemɵntrainpa melsrape, ellkuamik
      yellwane nɵtrɵ ampikmeran, michi purawan, tarɵmarɵp lawa, trukutrempe kuatrɵppe kapɵrwanpa,
      pɵlsrukikwanpa tarɵ mara, tɵpɵtak ɵlɵr tsinchelantɵ kuatra yell wesreikkɵn, tap yell kɵntrainpe.
    espanolGlosa: Semilla de maíz
    espanolExplicacion: >-
      para obtener la semilla de maíz, se amarran las mazorcas de a dos por sus hojas y se colocan unas sobre
      otras, formando racimos. Estos racimos se cuelgan en la cocina o en la sala, donde el humo ayuda a
      secarlas y a prevenir el ataque del gorgojo.

      Una vez secas, las mazorcas se desgranan siguiendo este proceso: primero se retiran los granos de la
      base y la punta, que se desechan por no ser aptos como semilla. Luego, se desgrana la parte central,
      seleccionando únicamente las hileras más rectas y los granos más grandes, que serán utilizados para la
      próxima siembra.
