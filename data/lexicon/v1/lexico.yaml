        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Yapsrɵ nepua ashen tɵr pillik kena kɵp, tañwañi, umera, illimera, nupirau kɵpelɵ.
    espanolGlosa: Azul claro
    espanolExplicacion: las tonalidades del azul claro se pueden apreciar en la lejanía del espacio infinito,
      evocando la profundidad del cielo y el misterio del universo. También se manifiestan en algunas flores,
      en el plumaje de ciertas aves y en la tonalidad que adquieren las nubes antes de la tormenta. En la
      cosmovisión cultural, este color representa la serenidad, la claridad y el equilibrio entre el agua y el
      aire. El azul claro invita a la contemplación y a la conexión espiritual con los elementos del cosmos,
      recordando la inmensidad y el movimiento constante de la vida que rodea al ser humano.
  - codigo: C1.S1.M17.E008
    nodoCodigo: C1.S1.M17
    posicion: 8
    tipo: estandar
    formas:
      - orden: 1
        lema: Tsurik
        categoriaGramatical: s.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Kɵshɵmpɵtɵ, tsurɵpall, tsurɵatuall, tsurɵkaulli, tsurɵ pɵlɵm,  illimerayu kena kɵn.
    espanolGlosa: Multicolor
    espanolExplicacion: Para el pueblo Misak, el color no se entiende solo como un aspecto visual, sino como una
      manifestación vital que expresa la diversidad y el equilibrio del mundo. En su lengua y pensamiento,
      existe una categoría específica para designar a los seres y elementos —animados o inanimados— que
      contienen en sí una combinación de dos o más tonalidades. Este concepto se aplica, por ejemplo, al
      arcoíris, a la bandera Misak, al plumaje de ciertas aves y a otros elementos naturales cuya identidad se
      distingue por la presencia armónica de múltiples colores; en castellano, podría denominarse
      “multicolor”. De manera simbólica, este mismo término en namtrik también se usa para describir a las
      personas de la comunidad que, al hablar, mezclan el namtrik con el castellano, olvidando poco a poco su
      lengua materna. En el ámbito comunitario, esta forma de hablar es vista con preocupación, pues refleja
      un proceso de pérdida del conocimiento lingüístico y cultural. Se considera que quienes recurren con
      frecuencia a palabras en castellano —existiendo equivalentes en namtrik— están dejando de tejer su
      palabra desde la raíz Misak, debilitando así uno de los pilares más profundos de su identidad colectiva.
  - codigo: C1.S1.M17.E009
