      pishimisakwan, kallimwan,  kɵsrɵkɵllimisakwan, kɵshɵmpɵtɵn, pi músikwan, pirɵ músikwan, nak músikwan,
      isik músikwan, pala músikmeran, pirɵ umpu músikmeran wamap, pinɵutrap. srɵtrɵp, kasrakranɵp, pishimarɵp
      sɵtɵmarɵp mɵmarik tusr. Maya músikmerapa, maya misakpa pishintɵ lincha kɵntrai tap unasha, pishimarɵpelɵ
      kɵpik kuitre. \r

      \ Masɵpe patsɵ pusrkuapen, kɵtrak trantrɵpen, kualana mutsik, asru kɵtrɵ pariklɵ malla tapmisrɵp, paraik
      kɵtraip, pusrkuapik pishirap, mɵ kɵn. musikwai mɵkɵp latrɵ tap tusr kɵn, tap katɵrapene."
    espanolGlosa: Coca (Erythroxylum coca) Planta de poder utilizada por los sabios tradicionales Misak
      conocedores en sus prácticas de orientación espiritual y equilibrio interior. También es consumida por
      la comunidad mascándola, pues ayuda a calmar el hambre, aporta energía y fortalece el cuerpo durante las
      jornadas de trabajo cotidiano.
