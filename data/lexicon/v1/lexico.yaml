    namtrikContexto: Metrappe kaña ishikmeran tusrmerapa mara,  kɵtsɵyu pusra nena pisikelɵ. kuanku tsik trul
      (yalɵpillik), pantsɵ trul (yalɵpillik), kamɵ (pikik), ɵskɵ tsik Ú (ɵskɵik), tuk tsik trul (ɵskɵik),
      chukura ishik (chilka), iklɵtɵka pishipelɵ.
    espanolGlosa: Teñir la hoja
    espanolExplicacion: "en tiempos antiguos, las hojas se teñían con pigmentos obtenidos de la naturaleza: el
      morado provenía de las pepas de motilón (Hieronyma macrocarpa) y del arándano de páramo (Vaccinium
      floribundum); el verde se lograba con hojas de lengua de vaca (Rumex obtusifolius); y el amarillo con
      flores de cacto rosa (Pereskia aculeata), junto con la corteza y los frutos del trompeto (Bocona
      frutescens). Hoy, muchas de estas prácticas han sido reemplazadas por colorantes industriales,
      preferidos por su facilidad de uso y disponibilidad, aunque la memoria Misak aún conserva el
      conocimiento de estos tintes ancestrales."
