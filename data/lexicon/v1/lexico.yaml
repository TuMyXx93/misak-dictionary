        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Sɵtɵelɵ mɵrtrain kɵmɵ, umputɵ mɵrɵpchiktɵ tapmai eshkaik.
    espanolGlosa: Ser discreto
  - codigo: C1.S1.M3.E008
    nodoCodigo: C1.S1.M3
