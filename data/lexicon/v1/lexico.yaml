        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Mukɵpen waminchen nilɵtɵ mɵrɵp wapik.
    espanolGlosa: Ser buen oyente
    espanolExplicacion: es aquella persona que acoge la palabra del otro con respeto, atención y silencio reflexivo
  - codigo: C1.S1.M3.E009
    nodoCodigo: C1.S1.M3
