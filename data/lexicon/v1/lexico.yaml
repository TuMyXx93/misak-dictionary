        categoriaGramatical: sn., simb.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sn., simb.
    namtrikContexto: Kuapelai mantsik, mu kuantrapkɵpen amtrupik, kuetsam kapik kɵn cha merapelɵ kɵn.
    espanolGlosa: Representación las mariposas nocturnas
    espanolExplicacion: simbolizan la presencia de los seres que ya han emprendido el viaje espiritual. Suelen
      aparecer en el mes de noviembre, tiempo en que se realizan las ofrendas en memoria de quienes partieron.
      También se dice que su presencia puede anunciar la despedida de un ser cercano, motivo por el cual se
      les respeta y no se les daña.
  - codigo: C1.S3.M2.E002
    nodoCodigo: C1.S3.M2
    posicion: 2
    tipo: estandar
    formas:
      - orden: 1
        lema: Ishuk Misak
        categoriaGramatical: sn., simb.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sn.,simb.
    namtrikContexto: Ishuk misak purɵ nu aship, purukup, kusrennɵp, pasrapik kuimpurɵ, pisik isik pusrɵp pasrik kɵn.
    espanolGlosa: Representación de la mujer misak
    espanolExplicacion: la mujer simboliza la sabiduría, la enseñanza y la continuidad de la cultura Misak. En el
      chumbe, su presencia rinde homenaje a su papel fundamental como portadora y transmisora de los
      conocimientos que fortalecen la memoria y la identidad del pueblo Misak.
  - codigo: C1.S3.M2.E003
    nodoCodigo: C1.S3.M2
    posicion: 3
    tipo: estandar
    formas:
      - orden: 1
        lema: Katsik nintak
        categoriaGramatical: SN.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: SN.
    namtrikContexto: Pirɵ nintak kui, tsantsɵn nintak kui katsik puaik, kampa misak mariklɵ.
    espanolGlosa: Representación de la taza semiglobular de base alta
    espanolExplicacion: son representaciones de las tazas tradicionales Misak, conocidas como tasines, las cuales
      se distinguen por su base semiglobular. Estas piezas tienen un origen prehispánico y forman parte del
      legado cultural que refleja la continuidad de los saberes y la estética ancestral Misak en la
      elaboración de utensilios de uso cotidiano y ceremonial.
  - codigo: C1.S3.M2.E004
    nodoCodigo: C1.S3.M2
    posicion: 4
    tipo: estandar
    formas:
      - orden: 1
        lema: Kɵnchapik
        categoriaGramatical: s., simb.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s., simb.
    namtrikContexto: "Namui kampawamyu trenchipelɵ kɵn: kan misak pasraɵrik nemtsikmai palasrɵ nepya, kɵtrɵattrap
      kaimape trattrɵ pakatɵ panchelɵ kɵnchapik misra pilap melamisrik kɵn."
    espanolGlosa: Representación de la estrella
    espanolExplicacion: cuentan los mayores que, en tiempos antiguos, un Misak perseguido por un cazador buscó
      refugio en una escalera. Subió y subió sin hallar la forma de regresar, hasta que su cuerpo se
      transformó en luz. Así nació la constelación conocida por el pueblo Misak como los siete venaditos, a la
      que el mundo occidental nombra las Pléyades. Este relato, transmitido de generación en generación,
      recuerda la profunda relación entre los Misak, el cosmos y la memoria de sus antepasados.
  - codigo: C1.S3.M2.E005
    nodoCodigo: C1.S3.M2
    posicion: 5
    tipo: estandar
    formas:
      - orden: 1
        lema: Pɵrɵnap
        categoriaGramatical: v.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: v.
    namtrikContexto: Ishuk misak lusik wepeñmɵntrai pɵrɵnaik pɵrtsi. Urek mai kintrai kitrik.
    espanolGlosa: Enchumbar
    espanolExplicacion: práctica tradicional que consiste en ajustar el anaco alrededor de la cintura de la mujer
      mediante el uso del chumbe, con el propósito de asegurar la prenda y evitar que se desplace o caiga.
      Asimismo, el término hace referencia a la acción de envolver a los niños con el chumbe para
      proporcionarles estabilidad, abrigo y favorecer un descanso tranquilo.
  - codigo: C1.S3.M2.E006
    nodoCodigo: C1.S3.M2
    posicion: 6
    tipo: estandar
    formas:
      - orden: 1
        lema: Pas pɵrtsi
        categoriaGramatical: sn., simb.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sn., simb.
    namtrikContexto: Pala itɵpɵrɵnaik pɵrtsi
    espanolGlosa: Faja o chumbe ancho que se coloca sobre el chumbe delgado
  - codigo: C1.S3.M2.E007
    nodoCodigo: C1.S3.M2
    posicion: 7
    tipo: estandar
    formas:
      - orden: 1
        lema: Pichip kitrɵp
        categoriaGramatical: v., simb.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: v., simb.
    namtrikContexto: Misakpe chumai kɵpen wepampɵppe pichip, chu amɵña katɵ amtruppe kitrɵp.
    espanolGlosa: Representación de la espiral
    espanolExplicacion: la doble espiral simboliza el movimiento constante del tiempo y del espacio en la vida
      Misak, expresando el ir y el regresar como parte del equilibrio de la existencia. Representa el acto de
      desenrollarse al salir del hogar y volver a enrollarse al regresar, imagen que refleja la conexión
      continua entre la persona, su territorio y su comunidad.
  - codigo: C1.S3.M2.E008
    nodoCodigo: C1.S3.M2
    posicion: 8
    tipo: estandar
    formas:
      - orden: 1
        lema: Pɵsr
        categoriaGramatical: s., simb.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s., simb.
    namtrikContexto: Pɵsr neship, pɵsr pinaip, pɵsrkalwan asha marik.
    espanolGlosa: Representación del sol
    espanolExplicacion: representa el amanecer, el atardecer y los rayos del sol, fuente de energía que nutre a
      las plantas y sostiene la vida a lo largo del día, recordando la relación constante entre la naturaleza
      y el equilibrio que mantiene todo lo existente.
  - codigo: C1.S3.M2.E009
    nodoCodigo: C1.S3.M2
    posicion: 9
    tipo: estandar
    formas:
      - orden: 1
        lema: Pura tusr
        categoriaGramatical: sn., simb.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sn., simb.
    namtrikContexto: Manakutre namui mámikpe purakuik kua trunun isua pisik isik pusrɵp pasrik kɵn.
    espanolGlosa: Representación de la planta de maiz
    espanolExplicacion: el maíz, alimento milenario de gran valor para el pueblo Misak, ocupa un lugar central en
      su vida y pensamiento. Por ello, está representado en el chumbe como símbolo de abundancia, autonomía y
      soberanía alimentaria, reflejando la conexión profunda entre la comunidad, la tierra y el sustento
      diario.
  - codigo: C1.S3.M2.E010
    nodoCodigo: C1.S3.M2
    posicion: 10
    tipo: estandar
    formas:
      - orden: 1
        lema: Shill pɵrtsi
        categoriaGramatical: sn.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sn.
    namtrikContexto: Shill pɵrtsipe isikwantɵ pasrik, umpu pɵrɵnaik, lusik lusap mur kesrumik.
    espanolGlosa: Chumbe delgado
    espanolExplicacion: chumbe delgado tradicional Misak elaborado en lana de oveja. Puede ser de uno o varios
      colores y se coloca directamente sobre el anaco para sujetarlo firmemente. De carácter funcional más que
      ornamental, se utiliza debajo del chumbe de colores, que cumple la función decorativa y simbólica.
  - codigo: C1.S3.M2.E011
    nodoCodigo: C1.S3.M2
    posicion: 11
    tipo: estandar
    formas:
      - orden: 1
        lema: Tsatsɵ
        categoriaGramatical: s., simb.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s., simb.
    namtrikContexto: Tsatsɵpe tsilɵmusik kuimpa purɵ untakyu pisik isik pusrɵp pasrik kɵn.
    espanolGlosa: Representación del colibrí
    espanolExplicacion: el colibrí representa la fuerza vital de la naturaleza y su presencia en el chumbe expresa
      la conexión y el equilibrio que los Misak mantienen con su entorno. Su figura recuerda la importancia de
      cuidar y armonizar la vida en todas sus formas dentro del territorio.
  - codigo: C1.S3.M2.E012
    nodoCodigo: C1.S3.M2
    posicion: 12
    tipo: estandar
    formas:
      - orden: 1
        lema: Tsurɵ pɵrtsi
        categoriaGramatical: sn., simb.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sn., simb.
    namtrikContexto: Tsurɵ pɵrtsipe  tapchik pala itɵpɵrɵnamik pasrik, pulɵ traintɵka trupɵnnik, pillik pusrɵp,
      pikik pusrɵp, chilka pusrɵp, yalik pusrɵp, ɵskɵik pusrɵp, truiklɵtɵka tsurɵ pusrɵppe tsɵpɵr pusrɵp, pɵsr
      marɵp, kɵnchapik marɵp, misak marɵp, kɵsapik marɵp, pura tusr marɵp, isik tɵl marɵp, illimera marɵp,
      unɵwasr lataik asha pusrɵp marik kɵn. Pulɵelɵpe pellɵn chipelɵ kɵn.
    espanolGlosa: Chumbe de colores
    espanolExplicacion: "chumbe tradicional Misak de carácter ornamental, tejido sobre fondo blanco denominado
      pellón. Presenta figuras geométricas y representaciones de la naturaleza como el sol, las estrellas,
      aves y luciérnagas, así como símbolos de gran valor cultural: la mujer Misak, el útero, el maíz y los
      husos. Se elabora en colores negro, rojo, azul, verde y amarillo, que destacan sobre el fondo claro,
      otorgándole un carácter simbólico y espiritual."
  - codigo: C1.S3.M2.E013
    nodoCodigo: C1.S3.M2
    posicion: 13
    tipo: estandar
    formas:
      - orden: 1
        lema: Ɵsik uninkatik
        categoriaGramatical: simb.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: simb.
    namtrikContexto: Srɵ unɵ kal-lain kutre, nurap ip, kɵlirap, kɵllirap, kuawa kansrɵmai ya, katɵ pipik mantrap
      atrumne katik isuik.
    espanolGlosa: Representación del ciclo de vida Misak
    espanolExplicacion: "el ciclo de vida Misak comprende las etapas que acompañan el recorrido del ser desde
      antes de su nacimiento hasta su retorno espiritual: preconcepción, concepción, nacimiento, niñez,
      juventud, adultez, vejez, viaje y regreso espiritual. Cada una de estas fases se desarrolla en armonía
      con los satisfactores de vida, entendidos como los bienes y elementos materiales y simbólicos que
      permiten el bienestar integral del ser humano dentro de su comunidad y territorio."
