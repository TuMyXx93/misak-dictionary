    namtrikContexto: Nu ya menta pɵtɵyachik marik, ishuk unɵ impípapɵ misren wannamik, tru ya umpupe ishuk unɵ
      michi wam nétɵchik marik.
    espanolGlosa: Choza de la menarca
    espanolExplicacion: pequeña choza circular de paja, situada junto a la casa grande, destinada al acto de
      iniciación que marca el paso de la niñez a la adultez cuando la mujer experimenta su primera
      menstruación. El tamaño de la choza debe ajustarse a la medida de la niña, de manera que solo ella pueda
      ocupar su interior.
  - codigo: C1.S4.M1.E003
    nodoCodigo: C1.S4.M1
    posicion: 3
    tipo: estandar
    formas:
      - orden: 1
        lema: Michiya umpu maramik
        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Míchiya umpu unan ka wantrai kɵmɵtɵ mallatɵ chikɵpen martraik karupelɵ kɵn, tsi pa tɵl
      urechik isik kup, tsipa wasr urekchik srap, pip patɵ naksruk nemarɵp kusrentrai.
    espanolGlosa: Dentro de la choza, la niña debe tejer con rapidez doce jigras en miniatura y elaborar doce
      husos de lana hilada con sus propias manos.
  - codigo: C1.S4.M1.E004
    nodoCodigo: C1.S4.M1
    posicion: 4
    tipo: estandar
    formas:
      - orden: 1
        lema: Michiyawan chitɵka marik
        categoriaGramatical: sn.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sn.
    namtrikContexto: Michiya umpupe, palawan putsinsrainuk mɵ tsilɵmera, míchipura, tsatɵ lee, chikau lee,
      ullishik sraik lee isikwan ɵlɵr kupik kɵntrai, kepuchip melsraik,  kash wasr malla srapik kɵntrai, Pura
      tsutsikkui, ɵlɵrtɵ tsikurek kui tɵka kɵshchik pañap marik, pall melsrɵp, turinmelsrɵp, isik kepimɵ
      pachiktɵ wantrai, palawane putsinsrɵp ya marik. Unan wannamikpe upisha kalus tratra, trupala pulla
      ishikwan, pultsiwan pɵtɵmai kitrɵp kaik.
    espanolGlosa: Partes de la choza
    espanolExplicacion: la construcción se elabora con paredes de caña de maíz seco o varas de madera, y un techo
      cubierto de paja. El piso se reviste primero con un cuero de oveja, sobre el cual se disponen hojas de
      siguis (Liabum solidagineum) y de vira vira (Achyrocline bogotensis). Para conservar el calor interno y
      proteger del viento, en las paredes de caña de maíz se cuelgan paños y ruanas. Bajo el techo de paja se
      colocan nidos de colibrí (Trochilidae), chicao (Icterus chrysater) y mochilero (Psarocolius decumanus),
      símbolos que enseñan a la niña a tejer con delicadeza, como lo hacen los pájaros. Asimismo, se cuelgan
      telarañas, que representan la habilidad y rapidez necesarias para realizar tejidos finos.
  - codigo: C1.S4.M1.E005
    nodoCodigo: C1.S4.M1
    posicion: 5
    tipo: estandar
    formas:
      - orden: 1
        lema: Trurap
        categoriaGramatical: v.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: v.
    namtrikContexto: Ishuk unan míchiya umpu trurap pip kualɵm wannɵppe, churakɵpen ishuk unɵkuik kɵppe urek tɵka
      kɵntrapik kɵpik kɵpen, urektɵkakuiklɵ asr neik, tasik palɵmɵwai, katsik palɵmɵwai míchi neikchik palapik
      kɵmɵ, trámtɵ urek kal-lamɵntrai. Truikwan isua trek ɵyek marɵpelɵ kuin kɵn.  Chish ɵsik misak kɵntrai
      isua, chi kuantrɵ kaik, tap purukup ishuk misak, ishuk kɵlirantrai, tap srainkɵp, tap usrinkɵp, tap
      awela kɵntrai, truyu pɵlpasra kusrennɵpelɵ kɵpik kuin kɵn. Trurap wappe pishiramɵ, pɵsrpachimɵ,
      pikatɵramɵ srekuamɵ esekamik kɵn.
    espanolGlosa: Afianzar los conocimientos y prepararse para el futuro
    espanolExplicacion: se trata de una práctica tradicional que busca otorgarle a la niña buenos presagios para
      su vida futura como mujer. Ella permanece dentro de la choza durante cuatro días y sus noches, tiempo en
      el cual no debe exponerse al sol, al agua ni al sereno. Estos augurios están orientados a que tenga
      hijos sanos y, a lo largo de su vida, pueda ser una buena madre, esposa, hija, abuela y, finalmente, una
      mujer sabia.
  - codigo: C1.S4.M1.E006
    nodoCodigo: C1.S4.M1
