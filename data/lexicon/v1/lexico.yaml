        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sn.
    namtrikContexto: Turin kui lusik kui, chap trupɵnna pasrɵp ippe, pasrikwan lasrua putsak kaltɵka pucha pɵnsrɵp
      yamik kɵn, maik trupunnik trumaitɵ nemisrtrai.
    espanolGlosa: Clavo
    espanolExplicacion: clavos que se fijan en los orificios externos del baston delgado. Los bordes del tejido se
      envuelven en sus puntas y se fijan para mantener la tensión y la forma de la urdimbre. Se desplaza hacia
      arriba a medida que avanza el tejido hasta su finalización.
  - codigo: C1.S3.M1.E019
