    espanolGlosa: Verde
    espanolExplicacion: el color verde se encuentra en la mayoría de las plantas de hojas tiernas, así como en
      algunas aves y frutos que aún están en proceso de maduración. En la cosmovisión cultural, este tono
      simboliza la juventud, el crecimiento y la fuerza vital que emerge de la Madre Tierra. Representa el
      inicio del ciclo de la vida, cuando todo está en desarrollo y transformación. El verde expresa la
      esperanza y la renovación constante de la naturaleza, recordando la importancia de cuidar y respetar los
      procesos que permiten que la vida florezca en armonía con el entorno.
