    espanolGlosa: Cosechar 1.
    espanolExplicacion: >-
      acción de escarbar y desenterrar los tubérculos comestibles que se desarrollan bajo la superficie del
      suelo como la papa, olluco, oca, mauja, patata. Este término se usa también para la cosecha del maíz,
      aunque su producción se genera en la parte aérea de la planta y no en el subsuelo. 

      Cosechar 2.: acción de recolección de productos que se desarrollan en la parte aérea de la planta y que
      requieren ser desprendidos manualmente. Aplica para cultivos como frijol, arveja, haba, así como para
      frutos originarios tales como mora, mortiño y curuba, entre otros. 

      Cosechar 3.: acción de arrancar la planta, este término se aplica en cultivos como cebolla, yuca y
      arracacha. Asimismo, se utiliza para referirse a la remoción de arbustos durante labores de limpieza y
      adecuación de potreros. 

      Cosechar 4.: acción de segar la planta mediante el uso de herramientas manuales, como la hoz o el
      machete. Aplica en cultivos de cereales y en el corte de pastos.
