        lema: Taita
        categoriaGramatical: s.
        esNeologismo: false
        rasgosGramaticales:
          - m.
        etiquetaOriginal: s.,m.
    namtrikContexto: Taitape nukɵllik misak, nu isupik, nu asipik, nu waminchipik, misak misak pera marɵp
      pasrapik, taita taik wampe manakutre mutauta kasik chipelɵ kɵpik kuin kɵn, wentɵsrɵ taita chip, kape
      tata chipelɵ misrik kuin kɵn.
    espanolGlosa: Taita es un término honorífico de profundo respeto empleado para designar a los hombres que han
      ejercido funciones de autoridad en el Cabildo Misak y que, aun después de concluir su mandato, continúan
      siendo reconocidos por su trayectoria, liderazgo, experiencia y servicio a la comunidad. Asimismo, este
      título se otorga a hombres Misak que, por su ejemplo y compromiso con el bienestar colectivo, han
      alcanzado un amplio reconocimiento y prestigio social. Es importante no confundir ni asociar taita con
      taitapuro, ya que ambos términos poseen significados y usos completamente distintos. Mientras taita
      constituye un título de reconocimiento y autoridad dentro de la organización sociopolítica Misak,
      taitapuro designa un muñeco artesanal de fin de año y un personaje de la tradición popular del sur de
      Colombia, especialmente de los departamentos del Cauca y Huila. Este simboliza el cierre de un ciclo,
      las vivencias del año que termina y el proceso de renovación y purificación representado en su quema
      durante la medianoche del 31 de diciembre.
