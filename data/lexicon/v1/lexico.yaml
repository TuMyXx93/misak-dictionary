        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Kaña ishik mantrɵwan wesrawua, tɵmyu kalus tratra lamɵ awenchitɵka ashichik  misram mulla,
      piu nena, pɵsryu kɵlɵntrai melsreik.
    espanolGlosa: Desvaritar y raspar de la hoja
    espanolExplicacion: proceso de desprender la nervadura central de la hoja de cañabrava, esa nervadura conocida
      como nerva,se raspa con un cuchillo para retirar la materia carnosa y dejar la fibra limpia.
      Posteriormente la fibra se seca al sol, se cocina para darle elasticidad y consistencia.
  - codigo: C1.S3.M5.E004
