        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Nak pilapik, naktrɵsr ánkɵrik, tusr úmeran, usha animeran, pɵsr kuapen pɵsr pinaip ankɵrap,
      pilmɵsr pachen, asha múnchi pɵnsraik. Ishumpur kasherap kasrak tsiniklɵyum kenamisrɵpik.
    espanolGlosa: Rojo
    espanolExplicacion: el color rojo representa el fuego, símbolo de la fuerza vital, la armonía y el respeto
      hacia los antepasados. En la cosmovisión del pueblo Misak, este color encarna la energía que da vida y
      movimiento, recordando el poder transformador del fuego que ilumina, protege y purifica. Más allá de su
      aspecto físico, el fuego mantiene viva la comunicación con los mayores espirituales y con la memoria
      ancestral, fortaleciendo el vínculo entre el presente y el origen. Así, el color rojo expresa la
      continuidad de la sabiduría heredada y guía el pensamiento Misak dentro de una línea de respeto,
      equilibrio y conexión con la naturaleza y el universo.
  - codigo: C1.S1.M17.E003
    nodoCodigo: C1.S1.M17
