    espanolGlosa: Gris
    espanolExplicacion: el color gris se encuentra en la naturaleza reflejado en el plumaje de algunas aves, en
      ciertos animales, en las nubes, en las cenizas y en las montañas rocosas o peñascos. En la cosmovisión
      cultural, este color representa la transición entre la luz y la oscuridad, simbolizando el equilibrio y
      la serenidad. El gris evoca también la fuerza de los elementos que han resistido el paso del tiempo,
      como las piedras y la tierra endurecida, recordando la sabiduría ancestral que permanece firme ante los
      cambios.
