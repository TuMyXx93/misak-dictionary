        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Ishuk unan tsapɵrappe, pip kualɵmyu trurap chap pira, mamik nena, wañik pirishipik kɵntrai
      tasikwan wañutsi kina, mɵ mara, alikelan mamik srɵttrai pasrɵpelɵ kɵn, wañik mannɵpik kɵntrai. Lus
      utrap, palɵ itchip ishuk unan pip katɵtɵ kɵsh punɵntrai pasrɵpelɵ kɵn.
    espanolGlosa: Acto de agradecimiento
    espanolExplicacion: finalmente, la niña se lava las manos con la planta "rendidora" (Soleirolia soleirolii),
      acto que antecede a la entrega de alimentos a los invitados, gesto simbólico para asegurar que en el
      futuro todas sus actividades estén colmadas de abundancia. Después, debe bailar exactamente cuatro veces
      al son de la música tradicional Misak, reafirmando con el movimiento el inicio de su nueva etapa de
      vida.
  - codigo: C1.S4.M1.E013
