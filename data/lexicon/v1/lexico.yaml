    espanolGlosa: La gente mestiza con barba
    espanolExplicacion: expresión empleada por el pueblo Misak para referirse a las personas no Misak,
      identificadas tradicionalmente por la presencia de barba como rasgo distintivo. Según la memoria
      histórica y la tradición oral Misak, esta denominación surgió durante los primeros contactos con los
      colonizadores, quienes, al consumir alimentos como la sopa, dejaban restos de comida adheridos a la
      barba. Este comportamiento, percibido como contrario a las normas de higiene y comportamiento de la
      comunidad, dio origen a esta forma de denominación, que constituye un referente histórico y cultural
      dentro del sistema de clasificación tradicional Misak.
