        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Metrap misakpe sranwan shillchik latachik  kuaka trutɵka tsushipelɵ, mɵin kualɵmpe traintɵka,
      terlenka tɵka, nailɵn tɵka tsushipelɵ kɵn. Mɵi misakmerape kantɵkɵmɵ pa, pɵn itɵpɵnsraik marɵp
      tsushipelɵ misran.
    espanolGlosa: Coser
    espanolExplicacion: cn el pasado, los sombreros Misak se cosían con hilos de fique en un solo nivel. En la
      actualidad se utilizan hilos, terlenka y nailon, permitiendo hasta tres niveles superpuestos. Esta
      transformación evidencia que la cultura Misak no es estática, sino que se renueva y recrea de manera
      constante.
  - codigo: C1.S3.M5.E008
