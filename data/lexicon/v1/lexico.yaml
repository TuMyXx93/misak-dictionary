    namtrikContexto: Mɵ marmɵ chilliku llirapen, kɵtraksrɵ ampen, kɵsrɵ malau mekampup asr ɵrɵ pisrɵ misrɵpik kɵn.
    espanolGlosa: Alergia atribuida al efecto del aroiris
    espanolExplicacion: desde la cosmovisión Misak, existen determinados lugares del territorio, como pantanos,
      nacimientos de agua, montañas y otros sitios considerados de poder o poco transitados por las personas,
      en los cuales se recomienda realizar previamente los remedios con plantas tradicionales antes de
      transitar por ellos. Según este conocimiento ancestral, cuando no se realizan dichas prácticas de
      protección, pueden presentarse alteraciones en el cuerpo, como la aparición de granos o erupciones en la
      piel, las cuales son atribuidas al efecto del aroiris. Esta concepción forma parte de los conocimientos
      propios relacionados con el cuidado del cuerpo, la relación con el territorio y el equilibrio entre las
      personas y los espacios de poder dentro de la cosmovisión Misak.
