        lema: Kuahe
        categoriaGramatical: loc.interj.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: loc.interj.
    namtrikContexto: "Pek yausrɵ puppe, kuahe chip, kueltɵ wamap pumik. \r

      Misak putrɵke taik wam kɵn"
    espanolGlosa: >-
      Antiguamente, en la comunidad Misak, las puertas de las casas solían estar siempre abiertas, ya que
      siempre había alguien en el hogar. Por esta razón, cuando una persona ajena llegaba, no tocaba la
      puerta, sino que decía la palabra "Kuahe".

      El propósito de esta palabra era verificar si había alguien dentro de la casa que pudiera atender al
      visitante. Esta expresión tiene un significado similar al gesto occidental de tocar la puerta para
      anunciar una llegada.
    dialogo:
      respuestaNamtrik: Kepamɵ.
      respuestaNamtrikContexto: Yau pupen weesha, untakmai nui yaumpu keperik.
      respuestaEspanolGlosa: Bien pueda pase
