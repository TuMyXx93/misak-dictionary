    namtrikContexto: Kuari peñmɵntrai métrapmai wentaukucha tsi licha pɵnsraik.
    espanolGlosa: Colocar el hilo de la barbilla
    espanolExplicacion: el hilo rojo, dispuesto en la parte delantera y trasera del sombrero, no solo asegura la
      prenda frente al viento, sino que también evoca la energía vital y la conexión del pueblo Misak con los
      ciclos de la naturaleza.
  - codigo: C1.S3.M5.E009
    nodoCodigo: C1.S3.M5
    posicion: 9
    tipo: estandar
    formas:
      - orden: 1
