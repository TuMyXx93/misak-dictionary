    espanolExplicacion: tipo de base de la jigra Misak elaborada mediante una técnica de tejido que incorpora
      patrones geométricos desde el inicio de su confección, realizada completamente a mano y sin el uso de
      agujas, que la diferencia de otros tipos de bases empleadas en la cestería o el tejido. Estas jigras
      pueden  confeccionarse con fibras de cabuya o de algodón, según la tradición y el uso previsto de la
      pieza.
