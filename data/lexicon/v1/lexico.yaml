        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Nú yaumpu kepatrupen, nak pulu pua wamisrmuatɵ malau pikɵ tsutsik ú lawa melsrɵpelɵ kɵn, malɵ
      tsurɵ pachimɵntrai, yantɵ srusrɵ misrɵp tap unɵ ú srutrancha.
    espanolGlosa: Florecimiento
    espanolExplicacion: Cuando la niña ingresa a la cocina y antes de sentarse junto al fogón, la madre coloca
      sobre sus mejillas varios pétalos de la flor de siete cueros (Tibouchina lepidota). Este gesto busca
      asegurar la lozanía y salud de su piel, a la vez que simboliza el florecimiento y la transición de niña
      a mujer.
