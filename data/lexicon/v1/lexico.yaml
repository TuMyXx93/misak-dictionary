    namtrikContexto: Tusryu kutre kaluspañau lutra sruamtrua, kalus kaya pɵsryu warɵp kɵlɵnna, mul-lapen tsik muta
      icha katrɵpelɵkɵn, tru yellwaiasik nɵ ɵrɵ tapikwantɵ, nɵtrɵelantɵ asha lawa, pur wasryu pusra, wallikatɵ
      nakish mucha su kemɵntrai esekapelɵ kɵn
    espanolGlosa: Semilla de frijol
    espanolExplicacion: >-
      la cosecha se realiza dejando la cáscara puesta. Luego, se lleva a la casa y se pone a secar al sol
      sobre un cuero de vaca. Cuando ya está bien seca, se golpea suavemente con un palo sobre el mismo cuero
      para separar los granos de la cáscara.

      Después, se seleccionan los granos más grandes y sanos para usarlos como semilla. Esta semilla se guarda
      en una jigra de cabuya y se cuelga en la sala, donde el humo ayuda a conservarla y a prevenir el ataque
      del gorgojo.
