    namtrikContexto: Pasrik lutɵwan pechan kalɵp, urɵwan kɵtrɵɵrɵp, ampurap ipurap tsiwan latrɵɵra waya, tatak
      muta itchip pasrik, kash puntrai.
    espanolGlosa: Apretar la trama
    espanolExplicacion: La espada se utiliza también para apretar los hilos de la trama contra el tejido ya
      formado, asegurando un tejido más compacto y uniforme.
  - codigo: C1.S3.M1.E025
    nodoCodigo: C1.S3.M1
    posicion: 25
    tipo: estandar
    formas:
      - orden: 1
        lema: "Tatak Urek:"
        categoriaGramatical: s.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Pasrikwan srape nemarɵpyain kuintɵ, tatak urek shushmera palapik kɵn, ne munchipyu kaltɵka
      nemaramne katik. Ampurap ipurap wayakwan lasrumik tatakkal urek trap puaik palapik kɵn.
    espanolGlosa: Espadas pequeñas para telar
    espanolExplicacion: herramientas de tejido utilizadas en las etapas finales de elaboración del tejido en
      telar. A medida que el espacio disponible entre la urdimbre y el tejido terminado disminuye, se requiere
      el uso de espadas de menor tamaño para facilitar el paso de la trama y mantener la precisión del
      proceso. Algunas de estas piezas presentan un orificio en uno de sus extremos, destinado a sujetar los
      hilos de la urdimbre, lo que permite conservar la tensión adecuada y completar el tejido de manera
      uniforme.
  - codigo: C1.S3.M1.E026
    nodoCodigo: C1.S3.M1
    posicion: 26
    tipo: estandar
    formas:
      - orden: 1
        lema: Tatak
        categoriaGramatical: s.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: s.
    namtrikContexto: Pasrin tatak.
    espanolGlosa: Espada para telar
    espanolExplicacion: La espada se inserta entre los hilos de la urdimbre y se gira para levantar algunos hilos
      y bajar otros, creando así la abertura por donde pasará la lanzadera. Su función es separar los hilos de
      la urdimbre, lo cual permite tener mejor visibilidad al momento de tejer. Este elemento se fabrica
      tradicionalmente con madera de chonta (Bactris gasipaes) debido a sus propiedades de resistencia,
      durabilidad y estabilidad estructural. No obstante, también puede elaborarse con otras especies de
      maderas finas de características similares como Yukpiñi (Clethra fimbriata) o, en versiones más
      recientes, con materiales metálicos, de acuerdo con la disponibilidad de recursos, las necesidades
      funcionales y las técnicas constructivas empleadas.
  - codigo: C1.S3.M1.E027
    nodoCodigo: C1.S3.M1
