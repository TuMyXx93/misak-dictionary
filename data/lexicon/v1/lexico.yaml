        categoriaGramatical: sv.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: sv.
    namtrikContexto: Ishuk unan chap pirape srɵiktik shau kewa, kasrak, pishinkalu, pulɵ pura kicha pusra, pi mara
      asrwan nɵ asiktɵ pinɵ tsurɵp, pip katɵ nui purap kusr purap, pipkatɵ atsimai katɵ, kalɵ pumɵntrai
      pinɵtsurik.
    espanolGlosa: Asperjar el agua
    espanolExplicacion: "tras el baño ritual, a la niña se le coloca ropa nueva como signo de su paso de la niñez
      a la vida de mujer. Luego, en un recipiente con agua se preparan hojas de suculenta (Echeveria elegans),
      alegría de páramo (Gentiana sedifolia) y maíz capio (Zea mays) molido. Con esta mezcla se asperja con la
      mano: cuatro veces hacia la derecha, como ofrenda para sí misma, y cuatro veces hacia la izquierda, en
      reconocimiento al Gran Espíritu de la naturaleza."
  - codigo: C1.S4.M1.E009
    nodoCodigo: C1.S4.M1
    posicion: 9
    tipo: estandar
    formas:
      - orden: 1
        lema: Pirɵp
        categoriaGramatical: v.
        esNeologismo: false
        rasgosGramaticales: []
        etiquetaOriginal: v.
    namtrikContexto: Pip kualɵmyu michi yaukutri wepera, usrinkui, kɵlik ishumpurmera, putrɵwape trurap piramik,
      kɵchik mɵn, wawel, chucha, aluna, achuntrul pusra mai kuaalana pirɵp, wentɵsrɵ chi kuantrɵ nemɵntrai.
    espanolGlosa: Bañarse el cuerpo
    espanolExplicacion: al concluir los cuatro días de reclusión en la choza, la niña es conducida al exterior y
      bañada con plantas medicinales como chulco (Oxalis corniculata), arracachilla (Myrrhidendron
      glaucescens), chucha (Siparuna echinata), chulco blanco (variedad de Oxalis corniculata) y hierba mora
      (Solanum nigrum). Este baño tiene como propósito fortalecer su cuerpo y asegurar que crezca sana,
      integrando así el conocimiento ancestral sobre el poder curativo y protector de las plantas.
  - codigo: C1.S4.M1.E010
    nodoCodigo: C1.S4.M1
    posicion: 10
    tipo: estandar
    formas:
