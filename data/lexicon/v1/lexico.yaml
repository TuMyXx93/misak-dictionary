    namtrikContexto: Nenámelan chismartrap chiwankɵpen pillmaik.
    espanolGlosa: >-
      Lavar los utensilios de cocina y los alimentos. El verbo "lavar" en namtrik posee cinco acepciones
      distintas, y su uso varía según el objeto que se esté limpiando. Estos verbos son pillmap, kinap,
      tsarɵp, kuallip y pirap.

      Aunque todos se traducen como "lavar", su aplicación es específica. Por ejemplo, en el campo semántico
      de "Nakchak", el verbo pillmap se utiliza exclusivamente para referirse a la acción de lavar alimentos y
      utensilios de cocina. A medida que se exploren otros campos semánticos, se introducirán los demás verbos
      según corresponda a su uso correcto.
