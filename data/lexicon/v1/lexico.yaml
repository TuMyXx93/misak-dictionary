    namtrikContexto: Tɵmpɵnsrɵp sraik, kan, pa, pɵn itɵpasrɵp nemarɵp sraik wasr.
    espanolGlosa: Técnica de tejido por fajas de la jigra
    espanolExplicacion: método tradicional de confección de la jigra Misak que consiste en tejer su cuerpo en
      secciones o fajas independientes, las cuales se unen posteriormente para conformar una sola pieza. El
      número de fajas —generalmente dos o tres— depende del tamaño definido por el wasrpiu (base geométrica de
      la jigra), que determina las dimensiones y la estructura final del tejido.
