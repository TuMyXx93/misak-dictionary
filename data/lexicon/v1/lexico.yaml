      ilapelɵ, tsɵnchelɵ mai wantrɵpelɵ punap ampik kuintɵ chin chi chin wantɵp tsi pa patɵ ilap (12) lusik
      tsi pa patɵ lusap, mɵkelɵ turi tsi pa patɵ ilap, tamara yastaumai ampɵpelɵ kɵpik kuinkɵn.
    espanolGlosa: Crucero
    espanolExplicacion: adorno pectoral tradicionalmente utilizado por las mujeres Misak, fabricado en plata por
      orfebres indígenas. Se compone de una serie de placas de plata unidas por eslabones del mismo metal y
      rematadas en la parte inferior por una cruz que puede llevar otras piezas colgantes, sean monedas,
      cruces más pequeñas, u otras figuras distintas.
