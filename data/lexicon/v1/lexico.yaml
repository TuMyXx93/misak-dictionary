    namtrikContexto: Putsaktsikpe mantrɵ puaik lusekwan lapelɵkɵn, urɵyu lasrua kalwan pɵnsramtik kɵntrai.
    espanolGlosa: Bastón delgado
    espanolExplicacion: bastón de madera delgada con pequeños orificios en sus extremos, colocado sobre el bastón
      de urdimbre. La madera usada para esta herramienta es el Lusek (Baccharis latifolia) debido a que esta
      madera es hueca y facilita la colocacion de los clavos.
  - codigo: C1.S3.M1.E018
    nodoCodigo: C1.S3.M1
    posicion: 18
