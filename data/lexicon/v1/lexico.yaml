    namtrikContexto: Ye unasha pusrik wasr
    espanolGlosa: Jigra para medir el peso
    espanolExplicacion: "es una jigra, tejida y diseñada con técnicas tradicionales, cumplía una función práctica
      como instrumento para medir el peso. Cada una tenía la capacidad de contener aproximadamente seis
      libras. En tiempos antiguos, cuando no existían aparatos de medición, esta jigra servía como unidad de
      referencia: por ejemplo, cuatro jigradas equivalían a veinticuatro libras, es decir, una arroba. Además
      de su utilidad, su elaboración reflejaba la precisión y el conocimiento ancestral de las mujeres
      tejedoras, quienes ajustaban el tamaño y la tensión del tejido según el uso que se le daba."
