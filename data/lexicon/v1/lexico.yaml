        etiquetaOriginal: s.
    espanolGlosa: Dolor
    espanolExplicacion: "esta palabra se utiliza junto con el nombre de la parte del cuerpo que presenta dolor.
      Desde el punto de vista gramatical, su uso en namtrik difiere del castellano, ya que el orden de las
      palabras se invierte: primero se menciona la parte del cuerpo afectada y luego se añade el término que
      indica el dolor. Por ejemplo, la expresión “dolor de cabeza” se estructura como tur pusrkuap, donde tur
      significa “cabeza” y pusrkuap expresa la sensación de dolor. Esta forma lingüística refleja la manera en
      que el pueblo Misak organiza el pensamiento y la descripción del cuerpo a través de su idioma."
