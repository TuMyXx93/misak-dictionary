      kal wesrup mɵ marik kau, kɵntsɵ ishikpa pusɵ kutra pachikpipa lintisha lusren  kɵshɵmpɵtɵ kal pillik,
      pikik, pulik, wetrupik kuin kɵn. pachik kau lusrape pishiramumik.
    espanolGlosa: "Flor de Araña o Trompetilla (Sigesbeckia jorullensis Kunth) Planta medicinal utilizada por los
      sabios tradicionales Misak para tratar la enfermedad conocida como Crin del Arcoíris (ver Microcampo 20:
      Kuantrɵmera Enfermedades). Su preparación consiste en macerar la planta junto con tabaco y aguardiente
      hasta formar un emplasto, el cual se envuelve en hojas de achira, se calienta al fuego y luego se aplica
      en la parte afectada. Este procedimiento debe realizarse a las 10:00 a.m., momento en que la crin del
      arcoíris permanece inactiva. Después de una hora, el emplasto se retira con cuidado, se armoniza y
      finalmente se deposita a la orilla del río como parte del cierre del proceso curativo. Finalmente se
      hacen lavados en la parte afectada con la yerba de arco."
