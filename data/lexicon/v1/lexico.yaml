    espanolGlosa: Quema de la roza
    espanolExplicacion: es una práctica agrícola que consiste en quemar de manera controlada la vegetación,
      principalmente arvenses y material vegetal seco, previamente cortado y dejado en el terreno. Esta
      actividad tiene como finalidad preparar el suelo para la siembra. Debido al riesgo de propagación del
      fuego, debe realizarse bajo condiciones y medidas de control que permitan evitar que las llamas se
      extiendan accidentalmente hacia áreas aledañas que no están destinadas a la quema.
