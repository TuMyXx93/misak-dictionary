    espanolExplicacion: significa echar raíces, afirmarse o establecerse con fuerza. Se usa tanto para las
      plantas, cuando un esqueje desarrolla raíces, como para las ideas o costumbres, cuando se fortalecen y
      se vuelven parte de una persona o de una cultura.
