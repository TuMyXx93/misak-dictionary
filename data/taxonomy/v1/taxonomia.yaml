          - { codigo: C1.S1.M3, namtrik: Pɵlapasra kusrennɵp, espanol: Principios }
          - { codigo: C1.S1.M4, namtrik: Nakkuk, espanol: Fogón }
          - { codigo: C1.S1.M5, namtrik: Nintakmera, espanol: Utensilios de cocina }
          - { codigo: C1.S1.M6, namtrik: Tsikalmera, espanol: Muebles y enseres }
          - { codigo: C1.S1.M7, namtrik: Mamikmera, espanol: Productos alimenticios }
          - { codigo: C1.S1.M8, namtrik: Mantɵ mara maiklɵ, espanol: Preparaciones, acciones y estado de los alimentos }
          - { codigo: C1.S1.M9, namtrik: Namuimai neniklɵ, espanol: Platos tradicionales }
          - { codigo: C1.S1.M10, namtrik: Tsapɵrap maiklɵ, espanol: Preparaciones especiales del ciclo de vida }
          - { codigo: C1.S1.M11, namtrik: Kullak mamikmera, espanol: Consistencia de los alimentos }
          - { codigo: C1.S1.M12, namtrik: Nai triku maik mɵrɵreiklɵ, espanol: Sabores y sensaciones }
          - { codigo: C1.S1.M13, namtrik: Unaasha neniklɵ, espanol: Medidas culinarias }
          - { codigo: C1.S1.M14, namtrik: Nenik utɵmera, espanol: Tiempos de cocción }
          - { codigo: C1.S1.M15, namtrik: Yauelɵ, espanol: Relaciones de parentesco }
          - { codigo: C1.S1.M16, namtrik: Kewa amɵnaiklɵ, espanol: Vestido }
          - { codigo: C1.S1.M17, namtrik: Pisiklɵ, espanol: Colores }
