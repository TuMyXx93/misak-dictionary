          - codigo: C1.S1.M19
            namtrik: Namui asru mɵrɵraik
            espanol: Acciones y estados humanos
            subniveles:
              - { codigo: C1.S1.M19.1, espanol: Funciones fisiológicas básicas, glosa: Excreción y eliminación corporal, secreciones corporales, respiración y vías aéreas }
              - { codigo: C1.S1.M19.2, espanol: Manifestaciones expresivas y comunicativas, glosa: Sonidos y expresiones vocales, gestos y movimientos expresivos }
              - { codigo: C1.S1.M19.3, espanol: Movimientos y desplazamientos corporales, glosa: Desplazamientos, cambios de posición o equilibrio }
              - { codigo: C1.S1.M19.4, espanol: Alimentación y necesidades fisiológicas, glosa: Procesos básicos para la supervivencia }
              - { codigo: C1.S1.M19.5, espanol: Procesos mentales y de conciencia }
              - { codigo: C1.S1.M19.6, espanol: Emociones y estados afectivos }
              - { codigo: C1.S1.M19.7, espanol: Acciones animales o simbólicas }
              - { codigo: C1.S1.M19.8, espanol: Características físicas }
              - { codigo: C1.S1.M19.9, espanol: Acciones de higiene corporal }
          - { codigo: C1.S1.M20, namtrik: Kuantrɵmera, espanol: Enfermedades }
