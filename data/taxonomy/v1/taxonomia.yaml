# Taxonomía del diccionario — versión 1
# Fuente: estructura-diccionario-campos-1-2-3-4.pdf (equipo lingüístico).
# Ortografía namtrik normalizada a ɵ (regla vigente: la vocal "o" no existe en namtrik).
# Los nombres entre paréntesis del PDF se guardan en "espanol".
# Ítems sin término namtrik (p. ej. subniveles del microcampo 19) van con "espanol" solamente.
# Cambios de nombres Misak requieren ratificación comunitaria (constitución C1.1).
version: 1
fuente:
  documento: estructura-diccionario-campos-1-2-3-4.pdf
  revisor: equipo lingüístico (validación pendiente de las glosas)
  nota: >-
    Campos 1 a 4 transcritos del PDF. Los términos (palabras) de cada microcampo
    llegarán desde el archivo .xlsm del equipo lingüístico en una fase posterior.
campos:
  - codigo: C1
    namtrik: Ya
    espanol: La casa
    subcampos:
      - codigo: C1.S1
        namtrik: Nakchak
        espanol: Cocina
        microcampos:
          - { codigo: C1.S1.M1, namtrik: Wammera, espanol: Lengua y memoria ancestral }
